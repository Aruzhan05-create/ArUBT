/* ---- math theory ---- */
THEORY.push(
  { id: "m-t1", topic: "m_arith", title: ["Percents and ratios", "Пайыздар және қатынастар", "Проценты и отношения"], body: ["p% of N = N · p / 100.\nIncrease by p%: multiply by (1 + p/100); decrease: by (1 − p/100).\nDividing N in the ratio a : b: one part = N / (a + b), then multiply.", "N санының p%-ы = N · p / 100.\np%-ға арттыру: (1 + p/100)-ге көбейту; кеміту: (1 − p/100)-ге.\nN-ді a : b қатынасында бөлу: бір бөлік = N / (a + b), сосын көбейтеміз.", "p% от N = N · p / 100.\nУвеличение на p%: умножить на (1 + p/100); уменьшение — на (1 − p/100).\nДеление N в отношении a : b: одна часть = N / (a + b), затем умножаем."], box: ["+20%, then −20% is NOT the original price: 1.2 · 0.8 = 0.96.", "+20%, сосын −20% бастапқы баға ЕМЕС: 1.2 · 0.8 = 0.96.", "+20%, затем −20% — это НЕ исходная цена: 1.2 · 0.8 = 0.96."] },
  { id: "m-t2", topic: "m_arith", title: ["Divisibility, GCD, LCM", "Бөлінгіштік, ЕҮОБ, ЕКОЕ", "Делимость, НОД, НОК"], body: ["Divisible by 3 / 9: digit sum divisible by 3 / 9. By 4: last two digits. By 5: ends in 0 or 5.\nGCD · LCM = a · b.", "3 / 9-ға бөлінеді: цифрлар қосындысы 3 / 9-ға бөлінсе. 4-ке: соңғы екі цифры. 5-ке: 0 не 5-пен аяқталса.\nЕҮОБ · ЕКОЕ = a · b.", "Делится на 3 / 9: сумма цифр делится на 3 / 9. На 4: две последние цифры. На 5: оканчивается на 0 или 5.\nНОД · НОК = a · b."], box: "a/b + c/d = (ad + bc) / bd" },
  { id: "m-t3", topic: "m_alg", title: ["Quadratic equations", "Квадрат теңдеулер", "Квадратные уравнения"], body: ["ax² + bx + c = 0, D = b² − 4ac.\nD > 0 — two roots, D = 0 — one, D < 0 — none.\nVieta (a = 1): x₁ + x₂ = −b, x₁ · x₂ = c.", "ax² + bx + c = 0, D = b² − 4ac.\nD > 0 — екі түбір, D = 0 — біреу, D < 0 — жоқ.\nВиет (a = 1): x₁ + x₂ = −b, x₁ · x₂ = c.", "ax² + bx + c = 0, D = b² − 4ac.\nD > 0 — два корня, D = 0 — один, D < 0 — нет.\nВиет (a = 1): x₁ + x₂ = −b, x₁ · x₂ = c."], box: "x = (−b ± √D) / 2a" },
  { id: "m-t4", topic: "m_alg", title: ["Inequalities and modulus", "Теңсіздіктер және модуль", "Неравенства и модуль"], body: ["Dividing both sides by a negative number flips the sign: −2x > 6 → x < −3.\n|x − a| = b (b > 0) → x = a ± b.\n|x − a| < b → a − b < x < a + b.", "Екі жағын теріс санға бөлгенде таңба ауысады: −2x > 6 → x < −3.\n|x − a| = b (b > 0) → x = a ± b.\n|x − a| < b → a − b < x < a + b.", "При делении на отрицательное число знак меняется: −2x > 6 → x < −3.\n|x − a| = b (b > 0) → x = a ± b.\n|x − a| < b → a − b < x < a + b."] },
  { id: "m-t5", topic: "m_pow", title: ["Powers and roots", "Дәрежелер және түбірлер", "Степени и корни"], body: ["aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.\n√a · √b = √(ab), a^(m/n) = ⁿ√(aᵐ).", "aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.\n√a · √b = √(ab), a^(m/n) = ⁿ√(aᵐ).", "aᵐ · aⁿ = aᵐ⁺ⁿ, aᵐ : aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.\n√a · √b = √(ab), a^(m/n) = ⁿ√(aᵐ)."] },
  { id: "m-t6", topic: "m_pow", title: ["Logarithms", "Логарифмдер", "Логарифмы"], body: ["log_a b = c means aᶜ = b (a > 0, a ≠ 1, b > 0).\nlog_a(xy) = log_a x + log_a y; log_a(x/y) = log_a x − log_a y; log_a xⁿ = n·log_a x.", "log_a b = c дегеніміз aᶜ = b (a > 0, a ≠ 1, b > 0).\nlog_a(xy) = log_a x + log_a y; log_a(x/y) = log_a x − log_a y; log_a xⁿ = n·log_a x.", "log_a b = c означает aᶜ = b (a > 0, a ≠ 1, b > 0).\nlog_a(xy) = log_a x + log_a y; log_a(x/y) = log_a x − log_a y; log_a xⁿ = n·log_a x."], box: "log₂ 8 = 3, lg 1000 = 3, log_a 1 = 0, log_a a = 1" },
  { id: "m-t7", topic: "m_seq", title: ["Arithmetic progression", "Арифметикалық прогрессия", "Арифметическая прогрессия"], body: ["Each term = previous + d.\naₙ = a₁ + (n − 1)d\nSₙ = (a₁ + aₙ)·n / 2 = (2a₁ + (n − 1)d)·n / 2", "Әр мүше = алдыңғы + d.\naₙ = a₁ + (n − 1)d\nSₙ = (a₁ + aₙ)·n / 2 = (2a₁ + (n − 1)d)·n / 2", "Каждый член = предыдущий + d.\naₙ = a₁ + (n − 1)d\nSₙ = (a₁ + aₙ)·n / 2 = (2a₁ + (n − 1)d)·n / 2"] },
  { id: "m-t8", topic: "m_seq", title: ["Geometric progression", "Геометриялық прогрессия", "Геометрическая прогрессия"], body: ["Each term = previous · q.\nbₙ = b₁·qⁿ⁻¹, Sₙ = b₁(qⁿ − 1)/(q − 1).\nIf |q| < 1, the infinite sum is S = b₁ / (1 − q).", "Әр мүше = алдыңғы · q.\nbₙ = b₁·qⁿ⁻¹, Sₙ = b₁(qⁿ − 1)/(q − 1).\n|q| < 1 болса, шексіз қосынды S = b₁ / (1 − q).", "Каждый член = предыдущий · q.\nbₙ = b₁·qⁿ⁻¹, Sₙ = b₁(qⁿ − 1)/(q − 1).\nЕсли |q| < 1, бесконечная сумма S = b₁ / (1 − q)."] },
  { id: "m-t9", topic: "m_trig", title: ["Table of values", "Мәндер кестесі", "Таблица значений"], body: ["Learn this table — most trig tasks rely on it.", "Осы кестені жаттаңыз — тригонометрия есептерінің көбі осыған сүйенеді.", "Выучите эту таблицу — большинство задач по тригонометрии опираются на неё."], box: "        0°   30°    45°    60°    90°\nsin     0    1/2    √2/2   √3/2   1\ncos     1    √3/2   √2/2   1/2    0\ntg      0    √3/3   1      √3     —" },
  { id: "m-t10", topic: "m_trig", title: ["Identities and reduction", "Тепе-теңдіктер және келтіру", "Тождества и приведение"], body: ["sin²α + cos²α = 1, tg α = sin α / cos α.\nReduction: with 90° or 270° the function changes (sin ↔ cos); with 180° or 360° it stays. The sign is the sign of the original function in that quarter.\n180° = π rad.", "sin²α + cos²α = 1, tg α = sin α / cos α.\nКелтіру: 90° не 270° болса функция ауысады (sin ↔ cos); 180° не 360° болса сақталады. Таңбасы — бастапқы функцияның сол ширектегі таңбасы.\n180° = π рад.", "sin²α + cos²α = 1, tg α = sin α / cos α.\nПриведение: при 90° или 270° функция меняется (sin ↔ cos); при 180° или 360° сохраняется. Знак — знак исходной функции в этой четверти.\n180° = π рад."] },
  { id: "m-t11", topic: "m_geo", title: ["Triangles", "Үшбұрыштар", "Треугольники"], body: ["Sum of angles = 180°. Area = ½·a·h.\nRight triangle: c² = a² + b². Triples: 3-4-5, 5-12-13, 8-15-17.\nSum of interior angles of an n-gon = (n − 2)·180°.", "Бұрыштар қосындысы = 180°. Аудан = ½·a·h.\nТікбұрышты үшбұрыш: c² = a² + b². Үштіктер: 3-4-5, 5-12-13, 8-15-17.\nn-бұрыштың ішкі бұрыштар қосындысы = (n − 2)·180°.", "Сумма углов = 180°. Площадь = ½·a·h.\nПрямоугольный треугольник: c² = a² + b². Тройки: 3-4-5, 5-12-13, 8-15-17.\nСумма внутренних углов n-угольника = (n − 2)·180°."] },
  { id: "m-t12", topic: "m_geo", title: ["Circle and solids", "Дөңгелек және денелер", "Круг и тела"], body: ["Circle: C = 2πr, S = πr².\nBox: V = abc. Cube: V = a³. Cylinder: V = πr²h. Cone: V = ⅓πr²h. Sphere: V = ⁴⁄₃πr³.", "Дөңгелек: C = 2πr, S = πr².\nПараллелепипед: V = abc. Куб: V = a³. Цилиндр: V = πr²h. Конус: V = ⅓πr²h. Шар: V = ⁴⁄₃πr³.", "Круг: C = 2πr, S = πr².\nПараллелепипед: V = abc. Куб: V = a³. Цилиндр: V = πr²h. Конус: V = ⅓πr²h. Шар: V = ⁴⁄₃πr³."] },
  { id: "m-t13", topic: "m_prob", title: ["Combinatorics", "Комбинаторика", "Комбинаторика"], body: ["Permutations: Pₙ = n!\nArrangements (order matters): A(n,k) = n! / (n − k)!\nCombinations (order does not matter): C(n,k) = n! / (k!(n − k)!)", "Алмастырулар: Pₙ = n!\nОрналастырулар (рет маңызды): A(n,k) = n! / (n − k)!\nТерулер (рет маңызды емес): C(n,k) = n! / (k!(n − k)!)", "Перестановки: Pₙ = n!\nРазмещения (порядок важен): A(n,k) = n! / (n − k)!\nСочетания (порядок не важен): C(n,k) = n! / (k!(n − k)!)"], box: "5! = 120, C(5,2) = 10, A(5,2) = 20" },
  { id: "m-t14", topic: "m_prob", title: ["Probability and statistics", "Ықтималдық және статистика", "Вероятность и статистика"], body: ["P = favourable outcomes / all outcomes, 0 ≤ P ≤ 1.\nMean = sum / count. Mode = most frequent value. Median = middle of the sorted list (mean of the two middle values if the count is even). Range = max − min.", "P = қолайлы нәтижелер / барлық нәтижелер, 0 ≤ P ≤ 1.\nОрташа = қосынды / саны. Мода = ең жиі мән. Медиана = реттелген тізімнің ортасы (саны жұп болса, ортаңғы екеуінің орташасы). Құлаш = max − min.", "P = благоприятные исходы / все исходы, 0 ≤ P ≤ 1.\nСреднее = сумма / количество. Мода — самое частое значение. Медиана — середина упорядоченного ряда (при чётном количестве — среднее двух средних). Размах = max − min."] }
);

/* ---------- Computer graphics ---------- */

  { id: "graph-t1", topic: "graph", title: ["Raster and vector graphics", "Растрлық және векторлық графика", "Растровая и векторная графика"], body: ["Raster: the image is a grid of pixels (photos). Scaling up makes it blocky.\nVector: the image is made of shapes described by formulas (logos, icons). It scales without quality loss.", "Растрлық: сурет пикселдер торынан тұрады (фотосуреттер). Үлкейткенде сатылы болып кетеді.\nВекторлық: сурет формулалармен сипатталған фигуралардан тұрады (логотип, иконка). Сапасы жоғалмай масштабталады.", "Растровая: изображение — сетка пикселей (фотографии). При увеличении появляются «ступеньки».\nВекторная: изображение из фигур, описанных формулами (логотипы, иконки). Масштабируется без потери качества."], box: ["Raster: BMP, PNG, JPG, GIF\nVector: SVG, AI, EPS, CDR", "Растр: BMP, PNG, JPG, GIF\nВектор: SVG, AI, EPS, CDR", "Растр: BMP, PNG, JPG, GIF\nВектор: SVG, AI, EPS, CDR"] },

  { id: "m-f1", topic: "m_func", title: ["Function and domain", "Функция және анықталу облысы", "Функция и область определения"], body: ["A function y = f(x) gives exactly one y for each x.\nDomain D(f) — the allowed x. Watch for: division (denominator ≠ 0), even roots (expression ≥ 0), logarithms (argument > 0).", "y = f(x) функциясы әр x-ке дәл бір y сәйкес қояды.\nАнықталу облысы D(f) — рұқсат етілген x мәндері. Сақ болыңыз: бөлу (бөлім ≠ 0), жұп дәрежелі түбір (өрнек ≥ 0), логарифм (аргумент > 0).", "Функция y = f(x) каждому x ставит в соответствие ровно один y.\nОбласть определения D(f) — допустимые x. Следите за делением (знаменатель ≠ 0), чётными корнями (выражение ≥ 0), логарифмами (аргумент > 0)."], box: "y = 1/(x − 2) → x ≠ 2\ny = √(x + 3) → x ≥ −3\ny = log₂(x − 1) → x > 1" },
  { id: "m-f2", topic: "m_func", title: ["Linear function", "Сызықтық функция", "Линейная функция"], body: ["y = kx + b — a straight line. k — slope: k > 0 rising, k < 0 falling. b — where the line crosses the y-axis.\nParallel lines have equal k. Zero: x = −b/k.", "y = kx + b — түзу сызық. k — бұрыштық коэффициент: k > 0 өседі, k < 0 кемиді. b — түзудің y осін қиятын нүктесі.\nПараллель түзулердің k-сы тең. Нөлі: x = −b/k.", "y = kx + b — прямая. k — угловой коэффициент: k > 0 возрастает, k < 0 убывает. b — точка пересечения с осью y.\nУ параллельных прямых k равны. Нуль: x = −b/k."], box: "k = (y₂ − y₁) / (x₂ − x₁)" },
  { id: "m-f3", topic: "m_func", title: ["Quadratic function", "Квадраттық функция", "Квадратичная функция"], body: ["y = ax² + bx + c — a parabola. a > 0: branches up, a < 0: down.\nVertex: x₀ = −b / 2a, y₀ = f(x₀). The minimum (a > 0) or maximum (a < 0) is at the vertex.", "y = ax² + bx + c — парабола. a > 0: тармақтары жоғары, a < 0: төмен.\nТөбесі: x₀ = −b / 2a, y₀ = f(x₀). Ең кіші (a > 0) не ең үлкен (a < 0) мән төбеде.", "y = ax² + bx + c — парабола. a > 0: ветви вверх, a < 0: вниз.\nВершина: x₀ = −b / 2a, y₀ = f(x₀). Минимум (a > 0) или максимум (a < 0) — в вершине."] },
  { id: "m-f4", topic: "m_func", title: ["Basic graphs and properties", "Негізгі графиктер және қасиеттер", "Основные графики и свойства"], body: ["y = k/x — hyperbola, y = √x — half of a parabola, y = |x| — a corner, y = aˣ — exponent, y = logₐx — logarithm.\nEven: f(−x) = f(x), symmetric about the y-axis (x², |x|, cos x). Odd: f(−x) = −f(x), symmetric about the origin (x³, 1/x, sin x).", "y = k/x — гипербола, y = √x — жарты парабола, y = |x| — бұрыш, y = aˣ — көрсеткіштік, y = logₐx — логарифмдік.\nЖұп: f(−x) = f(x), y осіне симметриялы (x², |x|, cos x). Тақ: f(−x) = −f(x), бас нүктеге симметриялы (x³, 1/x, sin x).", "y = k/x — гипербола, y = √x — половина параболы, y = |x| — «уголок», y = aˣ — показательная, y = logₐx — логарифмическая.\nЧётная: f(−x) = f(x), симметрия относительно оси y (x², |x|, cos x). Нечётная: f(−x) = −f(x), симметрия относительно начала координат (x³, 1/x, sin x)."] }

const pw = (a, n) => n === 0 ? neg(a) : (a === 1 ? '' : a === -1 ? '−' : neg(a)) + 'x' + (n === 1 ? '' : sup(n));
THEORY.push(
  { id: "m-d1", topic: "m_deriv", title: ["What a derivative is", "Туынды дегеніміз не", "Что такое производная"], body: ["The derivative f′(x) is the rate of change of a function.\nGeometrically: f′(x₀) is the slope of the tangent at x₀.\nPhysically: if s(t) is the position, then v(t) = s′(t) is the speed and a(t) = v′(t) the acceleration.", "f′(x) туындысы — функцияның өзгеру жылдамдығы.\nГеометриялық мағынасы: f′(x₀) — x₀ нүктесіндегі жанаманың бұрыштық коэффициенті.\nФизикалық мағынасы: s(t) — орын болса, v(t) = s′(t) — жылдамдық, a(t) = v′(t) — үдеу.", "Производная f′(x) — скорость изменения функции.\nГеометрически: f′(x₀) — угловой коэффициент касательной в точке x₀.\nФизически: если s(t) — положение, то v(t) = s′(t) — скорость, a(t) = v′(t) — ускорение."] },
  { id: "m-d2", topic: "m_deriv", title: ["Table of derivatives", "Туындылар кестесі", "Таблица производных"], body: ["Learn this table by heart — every task uses it.", "Осы кестені жатқа біліңіз — әр есеп осыған сүйенеді.", "Выучите таблицу наизусть — она нужна в каждой задаче."], box: "(C)′ = 0\n(x)′ = 1\n(xⁿ)′ = n·xⁿ⁻¹\n(√x)′ = 1 / (2√x)\n(sin x)′ = cos x\n(cos x)′ = −sin x\n(eˣ)′ = eˣ\n(ln x)′ = 1/x" },
  { id: "m-d3", topic: "m_deriv", title: ["Rules", "Ережелер", "Правила"], body: ["(u + v)′ = u′ + v′\n(C·u)′ = C·u′\n(u·v)′ = u′v + uv′\n(u/v)′ = (u′v − uv′) / v²\nComposite: (f(g(x)))′ = f′(g(x))·g′(x)", "(u + v)′ = u′ + v′\n(C·u)′ = C·u′\n(u·v)′ = u′v + uv′\n(u/v)′ = (u′v − uv′) / v²\nКүрделі функция: (f(g(x)))′ = f′(g(x))·g′(x)", "(u + v)′ = u′ + v′\n(C·u)′ = C·u′\n(u·v)′ = u′v + uv′\n(u/v)′ = (u′v − uv′) / v²\nСложная функция: (f(g(x)))′ = f′(g(x))·g′(x)"], box: "(3x² + 5x)′ = 6x + 5\n(sin 2x)′ = 2cos 2x" },
  { id: "m-d4", topic: "m_deriv", title: ["Using the derivative", "Туындыны қолдану", "Применение производной"], body: ["f′(x) > 0 — the function increases, f′(x) < 0 — decreases.\nCritical points: f′(x) = 0. If f′ changes + → −, it is a maximum; − → +, a minimum.\nTangent at x₀: y = f(x₀) + f′(x₀)(x − x₀).", "f′(x) > 0 — функция өседі, f′(x) < 0 — кемиді.\nКризистік нүктелер: f′(x) = 0. f′ таңбасы + → − ауысса, максимум; − → + болса, минимум.\nx₀ нүктесіндегі жанама: y = f(x₀) + f′(x₀)(x − x₀).", "f′(x) > 0 — функция возрастает, f′(x) < 0 — убывает.\nКритические точки: f′(x) = 0. Смена знака f′ с + на − — максимум; с − на + — минимум.\nКасательная в x₀: y = f(x₀) + f′(x₀)(x − x₀)."] }
);

/* ---------- Math: integral ---------- */
THEORY.push(
  { id: "m-i1", topic: "m_integ", title: ["Antiderivative", "Алғашқы функция", "Первообразная"], body: ["F(x) is an antiderivative of f(x) if F′(x) = f(x). All antiderivatives: F(x) + C.\nCheck yourself: differentiate your answer and you must get f(x).", "F′(x) = f(x) болса, F(x) — f(x)-тің алғашқы функциясы. Барлық алғашқы функциялар: F(x) + C.\nӨзіңізді тексеріңіз: жауабыңыздың туындысы f(x) болуы керек.", "F(x) — первообразная f(x), если F′(x) = f(x). Все первообразные: F(x) + C.\nПроверка: производная ответа должна дать f(x)."], box: "∫ xⁿ dx = xⁿ⁺¹/(n+1) + C\n∫ 1/x dx = ln|x| + C\n∫ eˣ dx = eˣ + C\n∫ sin x dx = −cos x + C\n∫ cos x dx = sin x + C" },
  { id: "m-i2", topic: "m_integ", title: ["Definite integral", "Анықталған интеграл", "Определённый интеграл"], body: ["Newton–Leibniz formula: ∫ₐᵇ f(x) dx = F(b) − F(a).\nProperties: ∫(f + g) = ∫f + ∫g, ∫k·f = k·∫f.", "Ньютон–Лейбниц формуласы: ∫ₐᵇ f(x) dx = F(b) − F(a).\nҚасиеттері: ∫(f + g) = ∫f + ∫g, ∫k·f = k·∫f.", "Формула Ньютона–Лейбница: ∫ₐᵇ f(x) dx = F(b) − F(a).\nСвойства: ∫(f + g) = ∫f + ∫g, ∫k·f = k·∫f."], box: "∫₀² 3x² dx = x³ |₀² = 8 − 0 = 8" },
  { id: "m-i3", topic: "m_integ", title: ["Area under a curve", "Қисық сызықты трапеция ауданы", "Площадь криволинейной трапеции"], body: ["If f(x) ≥ 0 on [a; b], the area between the graph and the x-axis is S = ∫ₐᵇ f(x) dx.\nArea between two graphs: S = ∫ₐᵇ (f(x) − g(x)) dx, where f ≥ g.", "[a; b] аралығында f(x) ≥ 0 болса, график пен x осі арасындағы аудан S = ∫ₐᵇ f(x) dx.\nЕкі график арасындағы аудан: S = ∫ₐᵇ (f(x) − g(x)) dx, мұнда f ≥ g.", "Если f(x) ≥ 0 на [a; b], площадь между графиком и осью x: S = ∫ₐᵇ f(x) dx.\nПлощадь между графиками: S = ∫ₐᵇ (f(x) − g(x)) dx, где f ≥ g."] }
);
G('mi_pow', 'm_integ', 1, ['Antiderivative of a power', 'Дәреженің алғашқы функциясы', 'Первообразная степени'], r => {
  const n = ri(r, 1, 5), a = (n + 1) * pick(r, [1, 2, 3, -1]), A = a / (n + 1);
  return { q: ["Find an antiderivative.", "Алғашқы функциясын табыңыз.", "Найдите первообразную."], code: `f(x) = ${pw(a, n)}`, explain: `${neg(a)}·x${sup(n + 1)}/${n + 1} = ${pw(A, n + 1)}`,
    ...mc(r, `F(x) = ${pw(A, n + 1)} + C`, [`F(x) = ${pw(a * n, n - 1)} + C`, `F(x) = ${pw(a, n + 1)} + C`, `F(x) = ${pw(A, n)} + C`, `F(x) = ${pw(a * (n + 1), n + 1)} + C`]) };
});
G('mi_def', 'm_integ', 2, ['Definite integral', 'Анықталған интеграл', 'Определённый интеграл'], r => {
  const k = pick(r, [2, 4, 6, -2]), m = ri(r, -5, 5), a = ri(r, -2, 2), b = a + ri(r, 1, 4), v = k * (b * b - a * a) / 2 + m * (b - a);
  const f = `${coef(k, 'x')}${m ? sg(m) : ''}`;
  return { q: QV, code: `∫ from ${neg(a)} to ${neg(b)} (${f}) dx`, explain: `F(x) = ${coef(k / 2, 'x²')}${m ? sg(m) + 'x' : ''}; F(${neg(b)}) − F(${neg(a)}) = ${neg(v)}`, ...mc(r, v, [k * (b - a) + m, v + m, k * (b * b - a * a) + m * (b - a), -v]) };
});
G('mi_area', 'm_integ', 3, ['Area under a parabola', 'Парабола астындағы аудан', 'Площадь под параболой'], r => {
  const b = pick(r, [1, 2, 3]), c = pick(r, [1, 3]), v = c * b ** 3 / 3 * 3 / 3;
  const S = c === 3 ? b ** 3 : null;
  if (S !== null) return { q: [`Find the area bounded by y = 3x², the x-axis and x = ${b}.`, `y = 3x², x осі және x = ${b} түзуімен шектелген ауданды табыңыз.`, `Найдите площадь фигуры, ограниченной y = 3x², осью x и прямой x = ${b}.`], explain: `∫₀^${b} 3x² dx = x³ = ${S}`, ...mc(r, S, [3 * b * b, S * 3, b * b, 6 * b]) };
  const B = 3 * b, S2 = B ** 3 / 3;
  return { q: [`Find the area bounded by y = x², the x-axis and x = ${B}.`, `y = x², x осі және x = ${B} түзуімен шектелген ауданды табыңыз.`, `Найдите площадь фигуры, ограниченной y = x², осью x и прямой x = ${B}.`], explain: `∫₀^${B} x² dx = ${B}³/3 = ${S2}`, ...mc(r, S2, [B * B, B ** 3, 2 * B, S2 / 3]) };
});

);

/* ---------- Math: vectors ---------- */
THEORY.push(
  { id: "m-v1", topic: "m_vec", title: ["Vector coordinates", "Вектор координаталары", "Координаты вектора"], body: ["Vector AB = (x₂ − x₁; y₂ − y₁).\nLength |a| = √(x² + y²). Sum: (x₁ + x₂; y₁ + y₂). k·a = (kx; ky).", "AB векторы = (x₂ − x₁; y₂ − y₁).\nҰзындығы |a| = √(x² + y²). Қосынды: (x₁ + x₂; y₁ + y₂). k·a = (kx; ky).", "Вектор AB = (x₂ − x₁; y₂ − y₁).\nДлина |a| = √(x² + y²). Сумма: (x₁ + x₂; y₁ + y₂). k·a = (kx; ky)."] },
  { id: "m-v2", topic: "m_vec", title: ["Dot product", "Скалярлық көбейтінді", "Скалярное произведение"], body: ["a · b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ.\nIf a · b = 0, the vectors are perpendicular.\nCollinear vectors have proportional coordinates.", "a · b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ.\na · b = 0 болса, векторлар перпендикуляр.\nКоллинеар векторлардың координаталары пропорционал.", "a · b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ.\nЕсли a · b = 0, векторы перпендикулярны.\nУ коллинеарных векторов координаты пропорциональны."] },
  { id: "m-v3", topic: "m_vec", title: ["Points on the plane", "Жазықтықтағы нүктелер", "Точки на плоскости"], body: ["Distance: d = √((x₂ − x₁)² + (y₂ − y₁)²).\nMidpoint: ((x₁ + x₂)/2; (y₁ + y₂)/2).\nCircle with centre (a; b) and radius R: (x − a)² + (y − b)² = R².", "Арақашықтық: d = √((x₂ − x₁)² + (y₂ − y₁)²).\nОртасы: ((x₁ + x₂)/2; (y₁ + y₂)/2).\nЦентрі (a; b), радиусы R шеңбер: (x − a)² + (y − b)² = R².", "Расстояние: d = √((x₂ − x₁)² + (y₂ − y₁)²).\nСередина: ((x₁ + x₂)/2; (y₁ + y₂)/2).\nОкружность с центром (a; b) и радиусом R: (x − a)² + (y − b)² = R²."] }
);
const TRI = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 6, 10], [4, 3, 5], [12, 5, 13]];
G('mv_len', 'm_vec', 1, ['Vector length', 'Вектор ұзындығы', 'Длина вектора'], r => {
  const [x, y, d] = pick(r, TRI), sx = pick(r, [1, -1]), sy = pick(r, [1, -1]);
  return { q: [`Find the length of a = (${neg(sx * x)}; ${neg(sy * y)}).`, `a = (${neg(sx * x)}; ${neg(sy * y)}) векторының ұзындығын табыңыз.`, `Найдите длину вектора a = (${neg(sx * x)}; ${neg(sy * y)}).`], explain: `√(${x * x} + ${y * y}) = ${d}`, ...mc(r, d, [x + y, d * d, Math.abs(sx * x + sy * y), d + 1]) };
});
G('mv_dot', 'm_vec', 2, ['Dot product', 'Скалярлық көбейтінді', 'Скалярное произведение'], r => {
  const a = [ri(r, -5, 5), ri(r, -5, 5)], b = [ri(r, -5, 5), ri(r, -5, 5)], v = a[0] * b[0] + a[1] * b[1];
  return { q: [`a = (${neg(a[0])}; ${neg(a[1])}), b = (${neg(b[0])}; ${neg(b[1])}). Find a · b.`, `a = (${neg(a[0])}; ${neg(a[1])}), b = (${neg(b[0])}; ${neg(b[1])}). a · b табыңыз.`, `a = (${neg(a[0])}; ${neg(a[1])}), b = (${neg(b[0])}; ${neg(b[1])}). Найдите a · b.`],
    explain: `${neg(a[0])}·${neg(b[0])} + ${neg(a[1])}·${neg(b[1])} = ${neg(v)}`, ...mc(r, v, [a[0] * b[1] + a[1] * b[0], a[0] + b[0] + a[1] + b[1], -v, v + 1]) };
});
G('mv_mid', 'm_vec', 1, ['Midpoint', 'Кесіндінің ортасы', 'Середина отрезка'], r => {
  const x1 = ri(r, -6, 6), y1 = ri(r, -6, 6), x2 = x1 + 2 * ri(r, -4, 4), y2 = y1 + 2 * ri(r, -4, 4), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return { q: [`A(${neg(x1)}; ${neg(y1)}), B(${neg(x2)}; ${neg(y2)}). Find the midpoint of AB.`, `A(${neg(x1)}; ${neg(y1)}), B(${neg(x2)}; ${neg(y2)}). AB кесіндісінің ортасын табыңыз.`, `A(${neg(x1)}; ${neg(y1)}), B(${neg(x2)}; ${neg(y2)}). Найдите середину AB.`],
    explain: `((${neg(x1)} + ${neg(x2)})/2; (${neg(y1)} + ${neg(y2)})/2)`, ...mc(r, `(${neg(mx)}; ${neg(my)})`, [`(${neg(x2 - x1)}; ${neg(y2 - y1)})`, `(${neg(my)}; ${neg(mx)})`, `(${neg(x1 + x2)}; ${neg(y1 + y2)})`, `(${neg(mx + 1)}; ${neg(my)})`, `(${neg(mx)}; ${neg(my + 1)})`, `(${neg(mx - 1)}; ${neg(my - 1)})`]) };
});
G('mv_perp', 'm_vec', 3, ['Perpendicular vectors', 'Перпендикуляр векторлар', 'Перпендикулярные векторы'], r => {
  const p = pick(r, [1, 2, 3, -2]), x = ri(r, -6, 6), rr = pick(r, [1, 2, 3, -1]), q = -p * x / rr;
  if (!Number.isInteger(q) || q === 0) return { q: [`a = (${neg(p)}; 2), b = (x; ${neg(-p)}). For which x are they perpendicular?`, `a = (${neg(p)}; 2), b = (x; ${neg(-p)}). x-тің қандай мәнінде олар перпендикуляр?`, `a = (${neg(p)}; 2), b = (x; ${neg(-p)}). При каком x они перпендикулярны?`], explain: `${neg(p)}x + 2·(${neg(-p)}) = 0 → x = 2`, ...mc(r, 2, [-2, p, -p, 0]) };
  return { q: [`a = (${neg(p)}; ${neg(q)}), b = (x; ${neg(rr)}). For which x are they perpendicular?`, `a = (${neg(p)}; ${neg(q)}), b = (x; ${neg(rr)}). x-тің қандай мәнінде олар перпендикуляр?`, `a = (${neg(p)}; ${neg(q)}), b = (x; ${neg(rr)}). При каком x они перпендикулярны?`],
    explain: `${neg(p)}x + ${neg(q)}·${neg(rr)} = 0 → x = ${neg(x)}`, ...mc(r, x, [-x, q, rr, x + 1]) };
});
G('mv_dist', 'm_vec', 2, ['Distance between points', 'Нүктелер арақашықтығы', 'Расстояние между точками'], r => {
  const [dx, dy, d] = pick(r, TRI), x1 = ri(r, -5, 5), y1 = ri(r, -5, 5), x2 = x1 + dx * pick(r, [1, -1]), y2 = y1 + dy * pick(r, [1, -1]);
  return { q: [`Find the distance between A(${neg(x1)}; ${neg(y1)}) and B(${neg(x2)}; ${neg(y2)}).`, `A(${neg(x1)}; ${neg(y1)}) және B(${neg(x2)}; ${neg(y2)}) нүктелерінің арақашықтығын табыңыз.`, `Найдите расстояние между A(${neg(x1)}; ${neg(y1)}) и B(${neg(x2)}; ${neg(y2)}).`],
    explain: `√(${dx * dx} + ${dy * dy}) = ${d}`, ...mc(r, d, [dx + dy, d * d, Math.abs(x2 + y2 - x1 - y1) || d + 2, d - 1]) };
});

/* ---------- Math: word problems ---------- */
THEORY.push(
  { id: "m-w1", topic: "m_word", title: ["Motion problems", "Қозғалысқа есептер", "Задачи на движение"], body: ["s = v · t. Towards each other: speeds add up (v₁ + v₂). Same direction: the difference (v₁ − v₂).\nOn a river: downstream v + c, upstream v − c (c — current).", "s = v · t. Қарама-қарсы: жылдамдықтар қосылады (v₁ + v₂). Бір бағытта: айырмасы (v₁ − v₂).\nӨзенде: ағыспен v + c, ағысқа қарсы v − c (c — ағыс жылдамдығы).", "s = v · t. Навстречу: скорости складываются (v₁ + v₂). В одном направлении — разность (v₁ − v₂).\nПо реке: по течению v + c, против течения v − c (c — скорость течения)."] },
  { id: "m-w2", topic: "m_word", title: ["Work problems", "Жұмысқа есептер", "Задачи на работу"], body: ["Take the whole job as 1. If someone does it in a hours, the productivity is 1/a per hour.\nWorking together: productivities add up, time t = 1 / (1/a + 1/b) = ab / (a + b).", "Бүкіл жұмысты 1 деп аламыз. Біреу оны a сағатта бітірсе, өнімділігі сағатына 1/a.\nБірге жұмыс: өнімділіктер қосылады, уақыт t = 1 / (1/a + 1/b) = ab / (a + b).", "Вся работа = 1. Если кто-то делает её за a часов, производительность 1/a в час.\nВместе: производительности складываются, время t = 1 / (1/a + 1/b) = ab / (a + b)."] },
  { id: "m-w3", topic: "m_word", title: ["Mixtures and percent", "Қоспалар және пайыз", "Смеси и проценты"], body: ["Amount of substance = mass × concentration.\nWhen mixing, add the amounts of substance and the masses separately, then divide.", "Зат мөлшері = масса × концентрация.\nАралыстырғанда зат мөлшерлері мен массаларды бөлек қосып, сосын бөлеміз.", "Количество вещества = масса × концентрация.\nПри смешивании складываем отдельно количество вещества и массы, затем делим."], box: "2 kg 10% + 3 kg 20%:\n(0.2 + 0.6) / 5 = 0.16 → 16%" },
  { id: "m-w4", topic: "m_word", title: ["How to set up an equation", "Теңдеуді қалай құру керек", "Как составить уравнение"], body: ["1) Choose the unknown x (what is asked or what is easiest to describe).\n2) Express the other quantities through x.\n3) Find two expressions for the same quantity and set them equal.\n4) Solve and check that the answer makes sense (no negative time).", "1) Белгісіз x-ті таңдаңыз (сұралғанын не сипаттауы оңайын).\n2) Қалған шамаларды x арқылы өрнектеңіз.\n3) Бір шаманың екі өрнегін тауып, теңестіріңіз.\n4) Шешіп, жауаптың мағынасын тексеріңіз (уақыт теріс болмайды).", "1) Выберите неизвестное x (то, что спрашивают, или то, что проще описать).\n2) Выразите остальные величины через x.\n3) Найдите два выражения одной величины и приравняйте.\n4) Решите и проверьте смысл ответа (время не бывает отрицательным)."] }
);
G('mw_meet', 'm_word', 1, ['Towards each other', 'Қарама-қарсы қозғалыс', 'Движение навстречу'], r => {
  const v1 = ri(r, 4, 12) * 10, v2 = ri(r, 4, 12) * 10, t = ri(r, 1, 5), S = (v1 + v2) * t;
  return { q: [`Two cars leave towns ${S} km apart towards each other at ${v1} km/h and ${v2} km/h. In how many hours will they meet?`, `Арақашықтығы ${S} км екі қаладан екі көлік бір-біріне қарай ${v1} км/сағ және ${v2} км/сағ жылдамдықпен шықты. Неше сағаттан кейін кездеседі?`, `Из двух городов, расстояние между которыми ${S} км, навстречу друг другу выехали машины со скоростями ${v1} и ${v2} км/ч. Через сколько часов они встретятся?`],
    explain: `${S} : (${v1} + ${v2}) = ${t}`, ...mc(r, t, [t * 2, Math.round(S / Math.max(v1, v2) * 10) / 10, t + 1, S / 100]) };
});
G('mw_river', 'm_word', 2, ['River problems', 'Өзенге есептер', 'Задачи на течение'], r => {
  const c = ri(r, 1, 4), v = c + ri(r, 4, 16), down = v + c, up = v - c, k = ri(r, 1, 4), d = down * up * k / gcd(down, up), T = d / down + d / up;
  return { q: [`A boat's own speed is ${v} km/h, the current is ${c} km/h. It goes ${d} km downstream and comes back. How many hours does the whole trip take?`, `Қайықтың меншікті жылдамдығы ${v} км/сағ, ағыс ${c} км/сағ. Ол ағыспен ${d} км жүріп, кері қайтты. Барлық жолға неше сағат кетті?`, `Собственная скорость лодки ${v} км/ч, течение ${c} км/ч. Она прошла ${d} км по течению и вернулась. Сколько часов занял весь путь?`],
    explain: `${d}/${down} + ${d}/${up} = ${d / down} + ${d / up} = ${T}`, ...mc(r, T, [2 * d / v, d / down, d / up, T + 1]) };
});
G('mw_work', 'm_word', 2, ['Working together', 'Бірлескен жұмыс', 'Совместная работа'], r => {
  const [a, b] = pick(r, [[3, 6], [4, 12], [6, 12], [10, 15], [12, 24], [20, 30], [6, 3], [12, 4]]), t = a * b / (a + b);
  return { q: [`One worker can do a job in ${a} hours, another in ${b} hours. How many hours will it take them together?`, `Бір жұмысшы жұмысты ${a} сағатта, екіншісі ${b} сағатта бітіреді. Екеуі бірге неше сағатта бітіреді?`, `Один рабочий выполняет работу за ${a} ч, другой — за ${b} ч. За сколько часов они выполнят её вместе?`],
    explain: `${a}·${b} / (${a} + ${b}) = ${t}`, ...mc(r, t, [(a + b) / 2, Math.abs(a - b), Math.min(a, b), t + 1]) };
});
G('mw_mix', 'm_word', 3, ['Mixtures', 'Қоспалар', 'Смеси'], r => {
  let m, n, p, q, c, tries = 0; do { m = ri(r, 1, 6); n = ri(r, 1, 6); p = pick(r, [10, 20, 30, 40, 50]); q = pick(r, [10, 20, 30, 40, 60]); c = (m * p + n * q) / (m + n); tries++; } while ((c % 1 || p === q) && tries < 50);
  if (c % 1) { m = 2; n = 3; p = 10; q = 20; c = 16; }
  return { q: [`${m} kg of a ${p}% salt solution is mixed with ${n} kg of a ${q}% solution. What is the concentration of the mixture?`, `${m} кг ${p}%-дық тұз ерітіндісі ${n} кг ${q}%-дық ерітіндімен араластырылды. Қоспаның концентрациясы қандай?`, `${m} кг ${p}%-го раствора соли смешали с ${n} кг ${q}%-го. Какова концентрация смеси?`],
    explain: `(${m}·${p} + ${n}·${q}) / ${m + n} = ${c}%`, ...mc(r, c + '%', [(p + q) / 2 + '%', (p + q) + '%', Math.round(c + 5) + '%', Math.round(c - 3) + '%', Math.max(p, q) + '%']) };
});

THEORY.push(
  { id: "m-t15", topic: "m_arith", title: ["Fractions and decimals", "Жай және ондық бөлшектер", "Обыкновенные и десятичные дроби"], body: ["a/b · c/d = ac/bd; a/b : c/d = a/b · d/c.\nTo compare fractions, bring them to a common denominator.\nUseful: 1/2 = 0.5, 1/4 = 0.25, 1/5 = 0.2, 1/8 = 0.125, 3/4 = 0.75.", "a/b · c/d = ac/bd; a/b : c/d = a/b · d/c.\nБөлшектерді салыстыру үшін ортақ бөлімге келтіріңіз.\nПайдалы: 1/2 = 0.5, 1/4 = 0.25, 1/5 = 0.2, 1/8 = 0.125, 3/4 = 0.75.", "a/b · c/d = ac/bd; a/b : c/d = a/b · d/c.\nЧтобы сравнить дроби, приведите их к общему знаменателю.\nПолезно: 1/2 = 0.5, 1/4 = 0.25, 1/5 = 0.2, 1/8 = 0.125, 3/4 = 0.75."] },
  { id: "m-t16", topic: "m_alg", title: ["Systems of equations", "Теңдеулер жүйесі", "Системы уравнений"], body: ["Substitution: express one variable and put it into the other equation.\nAddition: add or subtract the equations so that one variable disappears.\nAlways check the answer in BOTH equations.", "Ауыстыру тәсілі: бір айнымалыны өрнектеп, екінші теңдеуге қоямыз.\nҚосу тәсілі: бір айнымалы жойылатындай теңдеулерді қосамыз не азайтамыз.\nЖауапты ЕКІ теңдеуде де тексеріңіз.", "Подстановка: выразите одну переменную и подставьте в другое уравнение.\nСложение: складываем или вычитаем уравнения, чтобы одна переменная исчезла.\nВсегда проверяйте ответ в ОБОИХ уравнениях."], box: "x + y = 7\nx − y = 1\n→ 2x = 8 → x = 4, y = 3" },
  { id: "m-t17", topic: "m_pow", title: ["Exponential equations", "Көрсеткіштік теңдеулер", "Показательные уравнения"], body: ["Bring both sides to the same base: aᶠ⁽ˣ⁾ = aᵍ⁽ˣ⁾ → f(x) = g(x).\nIf it does not work, take a logarithm: aˣ = b → x = logₐ b.", "Екі жағын бірдей негізге келтіріңіз: aᶠ⁽ˣ⁾ = aᵍ⁽ˣ⁾ → f(x) = g(x).\nБолмаса, логарифмдеңіз: aˣ = b → x = logₐ b.", "Приведите обе части к одному основанию: aᶠ⁽ˣ⁾ = aᵍ⁽ˣ⁾ → f(x) = g(x).\nЕсли не выходит, логарифмируйте: aˣ = b → x = logₐ b."], box: "4ˣ = 32 → 2²ˣ = 2⁵ → x = 2.5" },
  { id: "m-t18", topic: "m_seq", title: ["Spotting the progression", "Прогрессияны тану", "Как распознать прогрессию"], body: ["Arithmetic: the DIFFERENCE between neighbours is constant (2, 5, 8, 11 — d = 3).\nGeometric: the RATIO between neighbours is constant (3, 6, 12, 24 — q = 2).\nMiddle term: aₙ = (aₙ₋₁ + aₙ₊₁)/2, bₙ² = bₙ₋₁ · bₙ₊₁.", "Арифметикалық: көршілер АЙЫРМАСЫ тұрақты (2, 5, 8, 11 — d = 3).\nГеометриялық: көршілер ҚАТЫНАСЫ тұрақты (3, 6, 12, 24 — q = 2).\nОртаңғы мүше: aₙ = (aₙ₋₁ + aₙ₊₁)/2, bₙ² = bₙ₋₁ · bₙ₊₁.", "Арифметическая: РАЗНОСТЬ соседних постоянна (2, 5, 8, 11 — d = 3).\nГеометрическая: ОТНОШЕНИЕ соседних постоянно (3, 6, 12, 24 — q = 2).\nСредний член: aₙ = (aₙ₋₁ + aₙ₊₁)/2, bₙ² = bₙ₋₁ · bₙ₊₁."] },
  { id: "m-t19", topic: "m_trig", title: ["Simple trig equations", "Қарапайым тригонометриялық теңдеулер", "Простейшие тригонометрические уравнения"], body: ["sin x = a (|a| ≤ 1): x = (−1)ⁿ arcsin a + πn.\ncos x = a (|a| ≤ 1): x = ± arccos a + 2πn.\ntg x = a: x = arctg a + πn. Here n is any integer.", "sin x = a (|a| ≤ 1): x = (−1)ⁿ arcsin a + πn.\ncos x = a (|a| ≤ 1): x = ± arccos a + 2πn.\ntg x = a: x = arctg a + πn. Мұнда n — кез келген бүтін сан.", "sin x = a (|a| ≤ 1): x = (−1)ⁿ arcsin a + πn.\ncos x = a (|a| ≤ 1): x = ± arccos a + 2πn.\ntg x = a: x = arctg a + πn. Здесь n — любое целое."], box: "sin x = 0 → x = πn\ncos x = 0 → x = π/2 + πn\nsin x = 1 → x = π/2 + 2πn" },
  { id: "m-t20", topic: "m_geo", title: ["Quadrilaterals and similarity", "Төртбұрыштар және ұқсастық", "Четырёхугольники и подобие"], body: ["Parallelogram: S = a·h. Rhombus: S = d₁·d₂/2. Square: S = a², diagonal a√2.\nSimilar figures with ratio k: lengths ×k, areas ×k², volumes ×k³.", "Параллелограмм: S = a·h. Ромб: S = d₁·d₂/2. Шаршы: S = a², диагоналы a√2.\nҰқсастық коэффициенті k болса: ұзындықтар ×k, аудандар ×k², көлемдер ×k³.", "Параллелограмм: S = a·h. Ромб: S = d₁·d₂/2. Квадрат: S = a², диагональ a√2.\nПри подобии с коэффициентом k: длины ×k, площади ×k², объёмы ×k³."] },
  { id: "m-t21", topic: "m_prob", title: ["Rules of probability", "Ықтималдық ережелері", "Правила вероятностей"], body: ["Opposite event: P(not A) = 1 − P(A).\nIncompatible events: P(A or B) = P(A) + P(B).\nIndependent events: P(A and B) = P(A) · P(B).", "Қарама-қарсы оқиға: P(A емес) = 1 − P(A).\nҮйлесімсіз оқиғалар: P(A немесе B) = P(A) + P(B).\nТәуелсіз оқиғалар: P(A және B) = P(A) · P(B).", "Противоположное событие: P(не A) = 1 − P(A).\nНесовместные события: P(A или B) = P(A) + P(B).\nНезависимые события: P(A и B) = P(A) · P(B)."], box: "Two coins, both heads: 1/2 · 1/2 = 1/4" }
);

const GAPI = 'https://generativelanguage.googleapis.com/v1beta/';
function modelScore(n) {
  const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); let s = m ? parseFloat(m[1]) * 100 : 0;
  if (/flash/.test(n)) s += 50;
  if (/lite/.test(n)) s -= 30;
  if (/preview|exp/.test(n)) s -= 20;
  if (/latest$/.test(n)) s += 5;
  return s;
}
async function listModels(key) {
  let res;

  if (!res.ok) await aiFail(res);

  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => String(m.name || '').replace(/^models\//, ''))
    .filter(n => /^gemini/.test(n) && !/image|tts|audio|live|embed|vision|thinking|robotics|computer/.test(n))
    .sort((a, b) => modelScore(b) - modelScore(a));
}
async function resolveModel(force) {

async function aiFail(res) {

  if (res.status === 404 || /not found|is not supported|unsupported model/i.test(detail)) { const e = new Error(t('err_model')); e.model = true; throw e; }
  if (res.status === 429) throw new Error(t('err_429'));

    throw new Error((keyBad ? t('err_key') : t('err_rej', res.status)) + (detail ? t('err_google') + detail.slice(0, 200) : ''));

/* ============ Quiz logic ============ */
function startQuiz(list, mode, info) {
  list = list.filter(Boolean);
  if (!list.length) { alert(t('no_questions')); return; }
  stopTimer();
  quiz = {
    list, mode, ...info, i: 0, done: false, pts: 0, max: 0, ok: 0, cnt: 0,
    ans: list.map(initAns), checked: list.map(() => false), aiOut: list.map(() => null), pyOut: list.map(() => ''), spent: list.map(() => 0),
    busy: false, pyBusy: false, mark: Date.now(),
    start: Date.now(), endAt: mode === 'exam' ? Date.now() + CONFIG.examMinutes * 60000 : 0
  };
  if (mode === 'exam') timerId = setInterval(tick, 1000);
  render(); window.scrollTo(0, 0);
}
function pauseT() { if (quiz && quiz.mark) { quiz.spent[quiz.i] += Date.now() - quiz.mark; quiz.mark = 0; } }
function resumeT() { if (quiz && !quiz.done && !(quiz.mode !== 'exam' && quiz.checked[quiz.i])) quiz.mark = Date.now(); }
function goTo(i) { if (!quiz || i < 0 || i >= quiz.list.length) return; pauseT(); quiz.i = i; resumeT(); render(); window.scrollTo(0, 0); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function tick() {
  if (!quiz || quiz.mode !== 'exam' || quiz.done) { stopTimer(); return; }
  const left = Math.round((quiz.endAt - Date.now()) / 1000);
  const el = $('#timer');
  if (el) { el.textContent = fmt(left); el.classList.toggle('low', left <= 60); }
  if (left <= 0) finish();
}
function pickOpt(i) {
  const q = quiz.list[quiz.i];
  if (quiz.mode !== 'exam' && quiz.checked[quiz.i]) return;
  const a = quiz.ans[quiz.i];
  if (q.type === 'multi') quiz.ans[quiz.i] = a.includes(i) ? a.filter(x => x !== i) : a.concat(i);
  else quiz.ans[quiz.i] = [i];
  render();
}
function check() {
  const i = quiz.i, q = quiz.list[i];
  if (!isAnswered(q, quiz.ans[i]) || quiz.checked[i]) return;
  pauseT();
  quiz.checked[i] = true;
  const p = ptsOf(q, quiz.ans[i]), ok = p === maxPts(q);
  quiz.cnt++; quiz.pts += p; quiz.max += maxPts(q); if (ok) quiz.ok++;
  if (!q.ai) { record(q, ok, quiz.mode); addTime(q.topic, quiz.spent[i]); save(); }
  render();
}
function finish() {
  if (!quiz || quiz.done) return;
  stopTimer(); pauseT();
  if (quiz.mode === 'exam') {
    const per = {}, ty = {}; let c = 0, pts = 0, max = 0;
    quiz.list.forEach((q, i) => {
      const p = ptsOf(q, quiz.ans[i]), m = maxPts(q), ok = p === m;
      if (ok) c++; pts += p; max += m;
      record(q, ok, 'exam'); addTime(q.topic, quiz.spent[i]);
      const x = per[q.topic] || (per[q.topic] = { p: 0, m: 0 }); x.p += p; x.m += m;
      const k = q.type === 'single' ? (q.ctx || q.ctxGroup ? 'ctx' : 'single') : q.type, y = ty[k] || (ty[k] = { p: 0, m: 0 }); y.p += p; y.m += m;
    });
    const sec = Math.min(Math.round((Date.now() - quiz.start) / 1000), CONFIG.examMinutes * 60);
    S.history.unshift({ d: new Date().toISOString(), c, n: quiz.list.length, pts, max, sec, mode: 'exam', subj: quiz.subj });
    S.history = S.history.slice(0, 60);
    quiz.res = { c, n: quiz.list.length, pts, max, sec, per, ty };

}

  try {

      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, km, 256);

function convSteps() {

  if (v.length > 16) return `<div class="cmp bad">${t('conv_big')}</div>`;
  const dec = parseInt(v, f);
  let h = '';
  if (f !== 10) {
    const terms = [...v].map((c, i) => `${parseInt(c, 16)}·${f}${sup(v.length - 1 - i)}`);
    h += `<div class="step"><b>1.</b> ${t('conv_s1', f)}<pre class="code">${v}${SUB[f]} = ${terms.join(' + ')}\n     = ${dec}</pre></div>`;
  }
  const res = dec.toString(to).toUpperCase();
  if (to !== 10) {
    const rows = []; let n = dec;
    if (n === 0) rows.push(`0 : ${to} = 0, ${t('rem')} 0`);
    while (n > 0) { rows.push(`${n} : ${to} = ${Math.floor(n / to)}, ${t('rem')} ${(n % to).toString(16).toUpperCase()}`); n = Math.floor(n / to); }
    h += `<div class="step"><b>${f !== 10 ? 2 : 1}.</b> ${t('conv_s2', to)}<pre class="code">${rows.join('\n')}</pre>${t('conv_s3')}</div>`;
  }
  if (f !== to && [2, 8, 16].includes(f) && [2, 8, 16].includes(to)) h += `<div class="muted">💡 ${t('conv_tip')}</div>`;
  return h + `<div class="cmp ok">${v}${SUB[f]} = ${res}${SUB[to]}</div>`;

  const head = `<header class="qhead">${backBtn('back')}<div class="grow"><b>${quiz.mode === 'exam' ? t('exam_result') + ' · ' + esc(subjName(quiz.subj)) : t('practice_done')}</b></div></header>`;
  if (quiz.mode === 'exam') {
    const prev = histOf(quiz.subj)[1];
    const perArr = Object.keys(r.per).map(id => ({ id, ...r.per[id] })), worst = perArr.slice().sort((a, b) => (b.m - b.p) - (a.m - a.p))[0];
    const groups = {};
    quiz.list.forEach((q0, i) => { const q = qv(q0), a = quiz.ans[i]; if (errCount(q, a)) (groups[q.topic] = groups[q.topic] || []).push({ q, a }); });
    const nWrong = Object.values(groups).reduce((s, g) => s + g.length, 0);
    const mist = Object.keys(groups).map(tp => `<details class="mg"><summary><span>${esc(tn(tp))}</span><span class="muted">${groups[tp].length} ${T3('mistakes', 'қате', 'ошибок')} ${ic('chev', 16)}</span></summary>${groups[tp].map(x => {
      const right = x.q.type === 'match' ? x.q.left.map((l, j) => (j + 1) + ' → ' + LET[x.q.answer[j]]).join(', ') : x.q.answer.map(i => esc(x.q.options[i])).join('; ');
      return `<div class="rev"><b>${esc(x.q.q)}</b>${x.q.code ? `<pre class="code">${esc(x.q.code)}</pre>` : ''}${x.q.type === 'match' ? `<div class="muted">${x.q.left.map((l, j) => (j + 1) + '. ' + esc(l)).join(' · ')}<br>${x.q.options.map((o, i) => LET[i] + ') ' + esc(o)).join(' · ')}</div>` : ''}<div class="muted">${t('your_ans', esc(ansText(x.q, x.a) || t('no_ans')))} · +${ptsOf(x.q, x.a)} / ${maxPts(x.q)}</div><div>${t('correct_ans', '<b>' + right + '</b>')}</div><div class="muted">${esc(x.q.explain || '')}</div></div>`;
    }).join('')}</details>`).join('');
    const ty = [['single', t('ex_single')], ['ctx', t('ex_ctx')], ['multi', t('ex_multi')], ['match', t('ex_match')]].filter(x => r.ty[x[0]]).map(x => `<div><span>${x[1]}</span><b>${r.ty[x[0]].p} / ${r.ty[x[0]].m}</b></div>`).join('');
    return `<div class="scr focus">${head}${p >= 80 ? confetti() : ''}
      <section class="resbig"><div class="rs">${r.pts}<span> / ${r.max}</span></div><div class="rm">${p >= 80 ? t('res_great') : p >= 50 ? t('res_good') : t('res_low')}</div>
        <div class="muted">${prev && prev.max ? T3(`Last time: ${prev.pts}`, `Өткен жолы: ${prev.pts}`, `В прошлый раз: ${prev.pts}`) + ' · ' : ''}${fmt(r.sec)}</div></section>
      ${worst && worst.m > worst.p ? `<section class="lost"><small>${T3('Where you lost the most points', 'Ең көп балл жоғалған жер', 'Где потеряно больше всего баллов')}</small><b>${esc(tn(worst.id))} — ${worst.p} / ${worst.m}</b><button class="cta" data-act="topic" data-v="${worst.id}">${T3('Practise', 'Жаттықтыру', 'Потренировать')}: ${esc(tn(worst.id))}</button></section>` : ''}
      <div class="card exl2">${ty}</div>
      <h3 class="sub">${t('mistakes')} (${nWrong})</h3>${mist || `<div class="card">${t('no_mist')}</div>`}
      <button class="btn ghost" data-act="back">${t('close')}</button></div>`;
  }
  const stop = quiz.stop, passed = quiz.passed;
  return `<div class="scr focus">${head}${p >= 80 ? confetti() : ''}
    <section class="resbig">${mascot(p >= 80 ? 'cheer' : p >= 50 ? 'happy' : 'think', 110)}<div class="rs">${r.pts}<span> / ${r.max}</span></div><div class="rm">${p >= 80 ? t('res_great') : p >= 50 ? t('res_good') : t('res_low')}</div><div class="muted">${t('pct_correct', p)}</div></section>
    ${stop ? `<div class="cmp ${passed ? 'ok' : 'neu'}">${passed ? T3('Stop completed! The next one is open.', 'Аялдама өтілді! Келесісі ашылды.', 'Остановка пройдена! Следующая открыта.') : T3(`Score ${stop.need}% or more to open the next stop.`, `Келесі аялдаманы ашу үшін ${stop.need}% не одан көп жина.`, `Набери ${stop.need}% или больше, чтобы открыть следующую остановку.`)}</div>` : ''}
    ${quiz.mode === 'review' ? `<p class="center muted">${t('left_nb', mistakeIds().length)}</p>` : ''}
    ${stop ? `<button class="cta" data-act="${passed ? 'gopath' : 'stopagain'}">${passed ? T3('Back to the path', 'Жолға оралу', 'Вернуться к пути') : T3('Try again', 'Қайта өту', 'Пройти снова')}</button>` : quiz.again ? `<button class="cta" data-act="again">${t('again')}</button>` : ''}
    <button class="btn ghost" data-act="back">${t('close')}</button></div>`;
}
function afterQuiz(q) {
  const r = q.res, p = r.max ? 100 * r.pts / r.max : 0;
  if (q.stop) { q.passed = p >= q.stop.need; if (q.passed && (S.path[q.stop.t] || 0) === q.stop.i) S.path[q.stop.t] = q.stop.i + 1; }
  if (q.lesson) S.lessonDone = today();
}

/* ============ Actions ============ */
function startStop(v) {
  const [tp, si] = v.split(':'), i = +si, n = S.path[tp] || 0;
  if (i > n) { toast(T3('Finish the previous stop first', 'Алдымен алдыңғы аялдаманы өт', 'Сначала пройди предыдущую остановку')); return; }
  const stop = { t: tp, i, need: i === 5 ? 70 : 60 };
  if (i === 4) {
    if (!S.settings.aiKey) { toast(t('ai_need_key')); tab = 'ai'; th = null; render(); return; }
    toast(t('ai_gen_msg'));
    aiGenerate(tp, { title: tn(tp) + ' · AI', stop }, m => toast('⚠ ' + m));
    return;
  }
  const list = i === 5 ? practiceSet([tp], 10) : practiceSet([tp], 6);
  startQuiz(list, 'practice', { title: tn(tp) + ' · ' + stopName(i), stop });
}
function startLesson() {
  const lp = lessonPlan(), due = shuffle(dueIds()).slice(0, lp.due).map(getQ).filter(Boolean);
  const focus = practiceSet([lp.w.id], lp.focus), others = topicsOf().map(x => x.id).filter(x => x !== lp.w.id);
  const fresh = practiceSet(shuffle(others).slice(0, 4), LESSON - due.length - focus.length);
  startQuiz(due.concat(focus, fresh), 'practice', { titleKey: 'daily', lesson: true });
}
function actions(a, v) {
  switch (a) {
    case 'lang': setLang(v); break;
    case 'subj': toggleSubj(); break;
    case 'setsubj': if (v !== curSubj()) toggleSubj(); break;
    case 'tab': tab = v; th = null; quiz = null; stopTimer(); render(); window.scrollTo(0, 0); break;
    case 'ptab': ptab = v; th = null; render(); break;
    case 'prtab': prtab = v; render(); break;
    case 'setdate': tab = 'prof'; prtab = 'settings'; th = null; render(); setTimeout(() => { const el = $('#dt'); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } }, 50); break;
    case 'aikey': tab = 'prof'; prtab = 'settings'; th = null; render(); setTimeout(() => { const el = $('#aiset'); if (el) el.scrollIntoView({ block: 'start' }); }, 50); break;
    case 'lesson': startLesson(); break;
    case 'plan': th = 'plan'; render(); window.scrollTo(0, 0); break;
    case 'stop': startStop(v); break;
    case 'gopath': quiz = null; tab = 'path'; ptab = 'path'; th = null; render(); break;
    case 'stopagain': { const s = quiz && quiz.stop; quiz = null; if (s) startStop(s.t + ':' + s.i); break; }
    case 'topic': topicQuiz(v); break;
    case 'ptype': typeQuiz(v); break;
    case 'review': if (dueIds().length) startQuiz(shuffle(dueIds()).slice(0, 20).map(getQ), 'review', { titleKey: 'srs_t' }); else toast(t('t_due_none')); break;
    case 'exam': startQuiz(buildExam(curSubj()), 'exam', { titleKey: 'exam', subj: curSubj() }); break;
    case 'again': { const g = quiz && quiz.again; quiz = null; if (g) actions(g.act, g.v); break; }
    case 'hardq': startQuiz(hardest().map(x => x.k.startsWith('gen:') ? genQ(x.k.slice(4), newSeed()) : QMAP[x.k]).filter(Boolean), 'practice', { titleKey: 'st_hard' }); break;
    case 'theory': openTheory(theoryQueue(), t('theory')); break;
    case 'tswipe': openTheory(theoryOf(v).map(c => c.id), tn(v)); break;
    case 'swipe': swipeMark(v); break;
    case 'taiexp': if (!S.settings.aiKey) { toast(t('ai_need_key')); break; } theoryAI(); break;
    case 'tback': th = null; render(); window.scrollTo(0, 0); break;
    case 'tools': tab = 'path'; ptab = 'tools'; th = null; render(); window.scrollTo(0, 0); break;
    case 'tool': th = 'tool:' + v; render(); window.scrollTo(0, 0); break;
    case 'score': th = 'score'; render(); window.scrollTo(0, 0); break;
    case 'trypy': { const c = THEORY.find(x => x.id === v); if (c) TS.code = tv(c).box; TS.out = ''; tab = 'path'; th = 'tool:py'; render(); window.scrollTo(0, 0); break; }
    case 'pyrun': pyRunTool(); break;
    case 'pyclear': TS.out = ''; render(); break;
    case 'pyq': pyRunQuiz(); break;
    case 'ttins': {
      const el = $('#tte'); if (!el) break;
      const s0 = el.selectionStart != null ? el.selectionStart : el.value.length, s1 = el.selectionEnd != null ? el.selectionEnd : s0;
      el.value = el.value.slice(0, s0) + v + el.value.slice(s1); TS.expr = el.value;
      el.focus(); el.setSelectionRange(s0 + v.length, s0 + v.length); $('#ttout').innerHTML = ttTable(); break;
    }
    case 'untpl': S.score.rows = [['hist', 20, 5], ['mlit', 10, 3], ['rlit', 10, 3], ['prof1', 50, 5], ['prof2', 50, 5]].map(x => ({ n: t('sc_' + x[0]), s: '', m: String(x[1]), min: x[2] })); save(); render(); break;
    case 'uselast':
      ['inf', 'math'].forEach((s, k) => { const h = histOf(s).find(x => x.max); if (h) { const r = S.score.rows[3 + k] || (S.score.rows[3 + k] = { n: '', s: '', m: '' }); r.n = subjName(s); r.s = String(Math.round(h.pts * 50 / h.max)); r.m = '50'; r.min = 5; } });
      save(); render(); break;
    case 'delphoto': S.settings.photo = ''; save(); render(); break;
    case 'chatsend': chatSend(); break;
    case 'chatq': chatQuestion(); break;
    case 'chatlast': AIX.msgs.push({ r: 'q', id: S.lastWrong, a: null }); render(); scrollMsgs(); break;
    case 'chatans': { const [i, j] = v.split(':').map(Number); chatAnswer(i, j); break; }
    case 'chatexp': chatExplain(+v); break;
    case 'chatplan': aiPlan(true); break;
    case 'chatgen': { const w = weakTopic() || pick1(topicsOf()); AIX.msgs.push({ r: 'me', text: T3('AI quiz: ', 'AI тест: ', 'AI-тест: ') + tn(w.id) }); AIX.msgs.push({ r: 'wait' }); render(); scrollMsgs();
      aiGenerate(w.id, { title: tn(w.id) + ' · AI' }, m => { const k = AIX.msgs.findIndex(x => x.r === 'wait'); AIX.msgs.splice(k, 1, { r: 'err', text: m }); render(); }).then(() => { const k = AIX.msgs.findIndex(x => x.r === 'wait'); if (k >= 0) AIX.msgs.splice(k, 1); });
      break; }
    case 'aiplan': aiPlan(false); break;
    case 'aitest': testAI(); break;
    case 'install': if (INST) { INST.prompt(); INST.userChoice.finally(() => { INST = null; render(); }); } break;
    case 'authtab': authUser = ($('#au') || {}).value || authUser; authMode = v; authErr = ''; render(); break;
    case 'register': doRegister(); break;
    case 'login': doLogin(); break;
    case 'guest': enter({ g: 1, n: t('guest') }, false); break;
    case 'logout': logout(); break;
    case 'aihelp': aiHelp(v); break;
    case 'opt': pickOpt(+v); break;
    case 'check': check(); break;
    case 'next': goTo(quiz.i + 1); break;
    case 'prev': goTo(quiz.i - 1); break;
    case 'jump': goTo(+v); break;
    case 'finish': if (quiz.mode === 'exam' && quiz.list.some((q, i) => !isAnswered(q, quiz.ans[i])) && !confirm(t('unanswered'))) break; finish(); break;
    case 'exitq': exitQuiz(); break;
    case 'back': quiz = null; render(); window.scrollTo(0, 0); break;
    case 'export': {
      const ex = { ...S, settings: { ...S.settings, aiKey: '' } };
      const blob = new Blob([JSON.stringify(ex, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = 'arubt-' + today() + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break;
    }
    case 'reset': if (confirm(t('reset_q'))) { try { localStorage.removeItem(KEY); } catch (e) { /* empty */ } S = def(); applyTheme(); render(); } break;
  }
}
function topicQuiz(v) {
  const tps = v === 'all' ? topicsOf().map(x => x.id) : [v];
  startQuiz(practiceSet(tps, CONFIG.practiceN), 'practice', v === 'all' ? { titleKey: 'mixed', again: { act: 'topic', v } } : { topicId: v, again: { act: 'topic', v } });
}
function typeQuiz(type) {
  const s = curSubj();
  if (type === 'ctx') { const g = contextGroups(s); if (g.length) startQuiz(pick1(g)(), 'practice', { titleKey: 'ex_ctx', again: { act: 'ptype', v: type } }); return; }
  const used = new Set(), out = [], tps = shuffle(topicsOf(s).map(x => x.id));
  for (let i = 0; out.length < 6 && i < 60; i++) { const q = oneFor(tps[i % tps.length], wpick([0.3, 0.5, 0.2]), used, type); if (q && !used.has(q.id)) { used.add(q.id); out.push(q); } }
  startQuiz(out, 'practice', { titleKey: type === 'multi' ? 'ex_multi' : 'ex_match', again: { act: 'ptype', v: type } });
}

/* ============ Rendering ============ */
const NAV = [['home', 'home', ['Home', 'Басты', 'Главная']], ['path', 'path', ['Path', 'Жол', 'Путь']], ['exam', 'clock', ['Exam', 'Емтихан', 'Экзамен']], ['ai', 'spark', ['AI', 'AI', 'AI']], ['prof', 'user', ['Profile', 'Профиль', 'Профиль']]];
function render() {
  document.documentElement.lang = L;
  document.title = 'ArUBT — ' + t('app_sub');
  document.body.classList.toggle('auth', !AUTH);
  if (!AUTH) { $('#app').innerHTML = viewAuth(); animateIn('auth' + authMode + L); return; }
  const focus = !!quiz || th === 'swipe';
  document.body.classList.toggle('focus', focus);
  $('#nav .nav-in').innerHTML = NAV.map(n => `<button data-tab="${n[0]}" class="${!quiz && n[0] === tab ? 'on' : ''} ${n[0] === 'ai' ? 'ai' : ''}">${n[1] === 'spark' ? spark(22) : ic(n[1], 22)}<span>${tx(n[2])}</span></button>`).join('');
  let html;
  if (quiz) html = quiz.done ? viewResult() : viewQuiz();
  else if (th === 'swipe') html = viewSwipe();
  else if (th === 'plan') html = viewPlan();
  else if (th === 'score') html = viewScoreSub();
  else if (th && String(th).startsWith('tool:')) html = viewTool(th.slice(5));
  else html = { home: viewHome, path: viewPathTab, exam: viewExamTab, ai: viewChat, prof: viewProf }[tab]();
  $('#app').innerHTML = html;
  animateIn(quiz ? (quiz.done ? 'res' : 'q' + quiz.i + (quiz.topicId || quiz.titleKey || quiz.title || '')) : tab + '|' + th + '|' + ptab + '|' + prtab + '|' + L + '|' + TH.i);
}

/* ============ Events ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { if (b.disabled) return; actions(b.dataset.act, b.dataset.v); return; }
  const n = e.target.closest('#nav button');
  if (n) { tab = n.dataset.tab; th = null; quiz = null; stopTimer(); render(); window.scrollTo(0, 0); if (tab === 'ai') scrollMsgs(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.closest) return;
  if (e.target.closest('.authform')) { e.preventDefault(); actions(authMode === 'login' ? 'login' : 'register'); }
  else if (e.target.id === 'aiq') { e.preventDefault(); chatSend(); }
  else if (e.target.id === 'pycode' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pyRunTool(); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const v = e.target.value;
  if (f === 'uq') { UF.q = v; $('#ulist').innerHTML = uniList(); return; }
  if (f === 'pycode') { TS.code = v; return; }
  if (f === 'conv_v') { TS.cv = v; $('#convout').innerHTML = convSteps(); return; }
  if (f === 'ttexpr') { TS.expr = v; $('#ttout').innerHTML = ttTable(); return; }
  if (['match', 'conv_f', 'conv_t', 'ug', 'theme', 'photo', 'aimodel'].includes(f)) return;
  if (f === 'aikey') { S.settings.aiKey = v.trim(); S.settings.aiAuto = ''; AIX.test = null; const tb = $('[data-act=aitest]'); if (tb) tb.disabled = !S.settings.aiKey; }
  else if (f === 'name') S.settings.name = v.slice(0, 30);
  else if (f === 'date') S.settings.examDate = v;
  else if (f === 'th') { S.score.th = v; $('#cmp').innerHTML = scoreMsg(); $('#ulist').innerHTML = uniList(); }
  else if (f === 'rn' || f === 'rs' || f === 'rm') { const r = S.score.rows[+e.target.dataset.r]; r[f === 'rn' ? 'n' : f === 'rs' ? 's' : 'm'] = v; $('#cmp').innerHTML = scoreMsg(); $('#ulist').innerHTML = uniList(); }
  save();
});
document.addEventListener('change', e => {
  const x = e.target, f = x.dataset && x.dataset.f;
  if (f === 'match' && quiz) { quiz.ans[quiz.i][+x.dataset.j] = +x.value; render(); return; }
  if (f === 'conv_f' || f === 'conv_t') { TS[f === 'conv_f' ? 'cf' : 'ct'] = +x.value; $('#convout').innerHTML = convSteps(); return; }
  if (f === 'ug') { UF.g = x.value; $('#ulist').innerHTML = uniList(); return; }
  if (f === 'theme') { S.settings.theme = x.value; applyTheme(); save(); return; }
  if (f === 'aimodel') { S.settings.aiModel = x.value; AIX.test = null; save(); render(); return; }
  if (f === 'photo') { setPhoto(x.files && x.files[0]); x.value = ''; return; }
  if (f === 'name' || f === 'date') { render(); return; }
  if (x.id === 'imp') {
    const fl = x.files[0]; if (!fl) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || typeof d !== 'object' || !d.stats) throw new Error('bad'); S = merge(d); save(); applyTheme(); render(); alert(t('imported')); } catch (_) { alert(t('bad_file')); } };
    rd.readAsText(fl);
  }
});
/* swipe gesture on theory cards */
let SW = null;
document.addEventListener('pointerdown', e => { const c = e.target.closest('#swcard'); if (!c || e.target.closest('button')) return; SW = { x: e.clientX, el: c, dx: 0 }; c.setPointerCapture && c.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', e => { if (!SW) return; SW.dx = e.clientX - SW.x; SW.el.style.transform = `translateX(${SW.dx}px) rotate(${SW.dx / 25}deg)`; SW.el.classList.toggle('gy', SW.dx > 60); SW.el.classList.toggle('gn', SW.dx < -60); });
document.addEventListener('pointerup', () => { if (!SW) return; const dx = SW.dx, el = SW.el; SW = null; if (Math.abs(dx) > 90) swipeMark(dx > 0 ? 'k' : 'r'); else { el.style.transform = ''; el.classList.remove('gy', 'gn'); } });
document.addEventListener('pointercancel', () => { if (SW) { SW.el.style.transform = ''; SW = null; } });

/* ============ Start ============ */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INST = e; if (tab === 'prof' && !quiz) render(); });
window.addEventListener('appinstalled', () => { INST = null; toast(T3('ArUBT is installed!', 'ArUBT орнатылды!', 'ArUBT установлен!')); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline mode unavailable */ }); }); }
applyTheme();
render();
  </script>
</body>
