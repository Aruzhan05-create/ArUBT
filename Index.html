<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArUBT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ArUBT">
  <meta name="description" content="ҰБТ-ға дайындық: информатика және математика">
  <meta name="theme-color" content="#f5b700">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#fffbea; --card:#ffffff; --text:#2a2208; --muted:#6b5f35; --line:#f0e3b0;
  --pri:#f5b700; --pri-text:#231a00; --pri-soft:#fff1b8; --pri-ink:#8a5a00;
  --ok:#15803d; --ok-bg:#e3f6e9; --bad:#b91c1c; --bad-bg:#fde8e8;
  --shadow:0 2px 6px rgba(138,90,0,.10);
  --sh-a:#7a4700; --sh-b:#d99500; --sh-c:#ffe680; --sh-glow:rgba(180,110,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110a; --card:#1f1a0e; --text:#fff7dc; --muted:#cdbf8f; --line:#3b3319;
    --pri:#ffd23f; --pri-text:#1b1400; --pri-soft:#3a2f0a; --pri-ink:#ffd23f;
    --ok:#6ee79a; --ok-bg:#12301f; --bad:#ff9a9a; --bad-bg:#3a1717;
    --shadow:none;
    --sh-a:#c98a00; --sh-b:#ffd23f; --sh-c:#fffbe0; --sh-glow:rgba(255,210,63,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#14110a; --card:#1f1a0e; --text:#fff7dc; --muted:#cdbf8f; --line:#3b3319;
  --pri:#ffd23f; --pri-text:#1b1400; --pri-soft:#3a2f0a; --pri-ink:#ffd23f;
  --ok:#6ee79a; --ok-bg:#12301f; --bad:#ff9a9a; --bad-bg:#3a1717;
  --shadow:none;
  --sh-a:#c98a00; --sh-b:#ffd23f; --sh-c:#fffbe0; --sh-glow:rgba(255,210,63,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
body.focus,body.auth{padding-bottom:24px}
h1{font-size:1.5rem;margin:0 0 6px}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:.92rem}
.center{text-align:center}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--pri)}
body.focus .top,body.auth .top{display:none}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.top-r{display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:1.6rem;letter-spacing:.5px}
.logo,.hero-logo{position:relative;display:inline-block}
.logo::after,.hero-logo::after{content:"✦";position:absolute;top:-6px;right:-16px;font-size:.7rem;color:var(--pri-ink);animation:twinkle 2.2s ease-in-out infinite}
.hero-logo{font-size:3.4rem;font-weight:900;letter-spacing:1px;margin:8px 0 0}
.hero-logo::after{font-size:1.1rem;right:-22px;top:-4px}
.shine{
  background:linear-gradient(100deg,var(--sh-a) 0%,var(--sh-b) 30%,var(--sh-c) 46%,var(--sh-b) 62%,var(--sh-a) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shine 3.2s linear infinite;
  filter:drop-shadow(0 0 5px var(--sh-glow));
  font-weight:900;
}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.shine,.logo::after,.hero-logo::after{animation:none}}
.auth-wrap{max-width:420px;margin:0 auto;padding:20px 0}
.hero-wrap{text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--pri-soft);padding:5px;border-radius:14px;margin-bottom:6px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--pri-ink);font:inherit;font-weight:800;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-text)}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:12px;font-size:1.2rem;cursor:pointer}
.langsw{display:inline-flex;gap:3px;background:var(--pri-soft);padding:3px;border-radius:12px}
.langsw button{border:0;background:transparent;color:var(--pri-ink);font:inherit;font-weight:800;font-size:.8rem;min-height:38px;padding:0 11px;border-radius:9px;cursor:pointer}
.langsw button.on{background:var(--pri);color:var(--pri-text)}
.auth-lang{text-align:right;margin-bottom:4px}

.app{max-width:720px;margin:0 auto;padding:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-bottom:0}
.grid2+.card,.grid2+h2{margin-top:12px}
.stat .big{font-size:2rem;font-weight:800;line-height:1.1}

.btn{
  display:block;width:100%;min-height:48px;padding:12px 16px;border-radius:14px;
  border:1px solid var(--pri);background:var(--pri);color:var(--pri-text);
  font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px;text-align:center;
}
.btn.ghost{background:transparent;color:var(--pri-ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.off{opacity:.45;pointer-events:none}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:8px 14px;margin:0}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px}

.bar{height:10px;background:var(--pri-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}

.topic{display:block;width:100%;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.topic .head{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.topic .head em{font-style:normal;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}

/* level + badges */
.lvl{background:linear-gradient(135deg,var(--pri-soft),var(--card))}
.lvl .lvhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.05rem}
.lvl .lvhead span{color:var(--muted);font-weight:700;font-size:.9rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:var(--card)}
.badge .bi{font-size:2rem;line-height:1.2}
.badge b{display:block;font-size:.88rem}
.badge span{font-size:.75rem;color:var(--muted)}
.badge.lock{opacity:.4;filter:grayscale(1)}
.chat{display:flex;gap:8px;margin-top:8px}
.chat input{flex:1}
.chat .btn{width:auto;margin-top:0;min-height:46px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qtop .grow{flex:1;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800;padding:6px 12px;border-radius:10px;background:var(--pri-soft)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);font-weight:700;margin-bottom:8px}
.qtext{font-size:1.1rem;font-weight:700;margin:6px 0 14px;white-space:pre-wrap}
.hint{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:52px;padding:12px 14px;margin-bottom:10px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;cursor:pointer;
}
.opt .box{font-size:1.2rem;width:1.4rem;text-align:center;color:var(--muted)}
.opt .txt{flex:1}
.opt .mk{font-weight:800;font-size:1.2rem;min-width:1.2rem;text-align:center}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .box{color:var(--pri-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb .ex{color:var(--text)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dots button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer}
.dots button.done{background:var(--pri-soft);border-color:var(--pri)}
.dots button.cur{outline:2px solid var(--pri);outline-offset:1px}

/* result */
.score-big{font-size:3rem;font-weight:800;text-align:center;line-height:1.1}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:last-child{text-align:right;white-space:nowrap}
.rev{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}

/* forms */
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=number],input[type=date],select{
  width:100%;min-height:46px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;
}
.srow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cmp{padding:12px 14px;border-radius:14px;margin-top:10px;font-weight:700}
.cmp.ok{background:var(--ok-bg);color:var(--ok)}
.cmp.bad{background:var(--bad-bg);color:var(--bad)}
.cmp.neu{background:var(--pri-soft);color:var(--pri-ink)}

/* theory */
.tcard h3{margin-bottom:8px}
.tbody{white-space:pre-wrap;margin-bottom:8px}
.tbox{background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700;white-space:pre-wrap}
.tmark{display:flex;gap:8px;margin-top:8px}
.tmark .btn{margin-top:0;min-height:42px;padding:8px 10px;font-size:.92rem}
.tmark .btn.on{background:var(--pri);color:var(--pri-text)}
.back{margin-bottom:8px}

/* universities */
.uni{border-top:1px solid var(--line);padding:10px 0}
.uni:first-child{border-top:0}
.uni .nm{font-weight:700}
.uni .meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.warn{background:var(--pri-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
.aibox{border:1px dashed var(--pri);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--pri-soft)}
.aibox .tag{font-size:.78rem;font-weight:700;color:var(--pri-ink);margin-bottom:6px}
.aibox .aitxt{white-space:pre-wrap}
.aibox.err{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.aibtns{display:flex;gap:8px;flex-wrap:wrap}
.aibtns .btn{flex:1;min-width:140px;margin-top:6px;min-height:42px;font-size:.92rem}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body.focus .nav,body.auth .nav{display:none}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:700;
  min-height:64px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.nav button span{font-size:1.4rem;line-height:1}
.nav button.on{color:var(--pri-ink)}
.nav button.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--pri);margin-top:2px}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri-ink);outline-offset:2px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.srow{grid-template-columns:1fr 1fr 1fr}}
/* ---- animation and mascot ---- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0 0 4px}
.hero .muted{margin:0}
.rmsg{font-weight:800;font-size:1.15rem;margin-top:4px}
.fbrow{display:flex;gap:12px;align-items:center}
.fbmas{flex:none}
.fbtxt{flex:1;min-width:0}
.mascot{overflow:visible;flex:none;animation:floaty 3.2s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mascot .bulb{animation:glow 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mascot.mood-cheer{animation:hop .8s ease-in-out infinite}
.mascot.mood-sad{animation:none}
.flame{display:inline-block;animation:flicker 1.2s ease-in-out infinite;transform-origin:50% 90%}
.btn,.opt,.topic{transition:transform .12s ease,box-shadow .2s ease,background .2s}
.btn:active,.opt:active,.topic:active{transform:scale(.97)}
@media (hover:hover){.topic:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(138,90,0,.18)}}
.enter>*{animation:rise .42s ease both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.10s}
.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.20s}
.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.30s}
.enter .bar>i{animation:grow .9s ease-out both;transform-origin:left}
.opt.ok{animation:pop .45s ease}
.opt.bad{animation:shake .4s ease}
.fb{animation:rise .3s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
/* ---- 3.1 additions ---- */
.langsw button{padding:0 9px}
.subjseg{margin-top:14px}
.subjseg button{font-size:.92rem}
.big2{font-size:1.6rem;font-weight:800;line-height:1.15}
.srsrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.lv{background:var(--card);border:1px solid var(--line)}
.ctx{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:10px 12px;margin:6px 0 10px;white-space:pre-wrap;font-size:.95rem;overflow-x:auto}
.ctx .tag{font-size:.78rem;font-weight:700;color:var(--pri-ink);margin-bottom:6px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.ctx.mono,pre.code,.pyout,.codeed{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:.88rem}
.ctx.mono{white-space:pre}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;overflow-x:auto;white-space:pre;line-height:1.45}
.pyout{background:#1b1608;color:#fff3c4;border-radius:12px;padding:10px 12px;margin:10px 0 0;white-space:pre-wrap;overflow-x:auto;max-height:340px}
.codeed{width:100%;min-height:200px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical;line-height:1.45;tab-size:4}
.mright{display:grid;gap:4px;background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.mright b{display:inline-block;min-width:1.4rem;color:var(--pri-ink)}
.mrow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.mrow .ml{flex:1;min-width:0}
.mrow select{width:auto;min-width:76px;min-height:42px}
.mrow .mk{font-weight:800;min-width:2.4rem;text-align:right}
.mrow.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.mrow.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb.part{background:var(--pri-soft);color:var(--pri-ink)}
.fb .pill{vertical-align:middle}
.srsnote{margin-top:4px;font-size:.82rem}
.step{margin:10px 0}
.syms{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.symb{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--pri-soft);color:var(--pri-ink);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.ttwrap{overflow-x:auto;margin-top:10px}
table.tt{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
table.tt th,table.tt td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:center}
table.tt th{color:var(--pri-ink)}
table.tt tr.on td{background:var(--ok-bg);color:var(--ok)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--muted);font-size:10px}
.chart .cl{fill:none;stroke:var(--pri-ink);stroke-width:2.5;stroke-linejoin:round}
.chart .cd{fill:var(--pri);stroke:var(--pri-ink);stroke-width:1.5}
.chart .cb{fill:var(--pri-soft)}
.chart .cbo{fill:var(--pri)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .lg1{background:var(--pri-soft);border:1px solid var(--line)}
.legend .lg2{background:var(--pri)}
.hard{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hard:last-of-type{border-bottom:0}
/* ================= 4.0 design ================= */
:root{
  --bg:#FFFBEA; --card:#FFFFFF; --text:#2A2208; --muted:#6B5F35; --line:#EADFB4; --soft:#F3EBCB;
  --pri:#F5B700; --pri-text:#231A00; --pri-soft:#FFF4CC; --pri-ink:#7A4F00; --pri-shadow:#C99500;
  --ink:#2A2208; --ink-text:#FFFBEA; --ink-muted:#D8CDA6; --ink-soft:#3D3313;
  --ai:#5B4BDB; --ai-bg:#EEEBFF; --ai-line:#CFC8FF; --ai-ink:#4535C4;
  --ok:#15803D; --ok-bg:#E3F6E9; --bad:#B91C1C; --bad-bg:#FDE8E8; --fire:#C2410C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110A; --card:#1F1A0E; --text:#FFF7DC; --muted:#CDBF8F; --line:#3B3319; --soft:#2A2412;
    --pri:#FFD23F; --pri-text:#1B1400; --pri-soft:#3A2F0A; --pri-ink:#FFD23F; --pri-shadow:#A88400;
    --ink:#2E2711; --ink-text:#FFF7DC; --ink-muted:#CDBF8F; --ink-soft:#463B17;
    --ai:#8C7FFF; --ai-bg:#221D45; --ai-line:#3D3570; --ai-ink:#C3BBFF;
    --ok:#6EE79A; --ok-bg:#12301F; --bad:#FF9A9A; --bad-bg:#3A1717; --fire:#FF9A5C;
  }
}
:root[data-theme="dark"]{
  --bg:#14110A; --card:#1F1A0E; --text:#FFF7DC; --muted:#CDBF8F; --line:#3B3319; --soft:#2A2412;
  --pri:#FFD23F; --pri-text:#1B1400; --pri-soft:#3A2F0A; --pri-ink:#FFD23F; --pri-shadow:#A88400;
  --ink:#2E2711; --ink-text:#FFF7DC; --ink-muted:#CDBF8F; --ink-soft:#463B17;
  --ai:#8C7FFF; --ai-bg:#221D45; --ai-line:#3D3570; --ai-ink:#C3BBFF;
  --ok:#6EE79A; --ok-bg:#12301F; --bad:#FF9A9A; --bad-bg:#3A1717; --fire:#FF9A5C;
}
#app{overflow-x:clip}
body{font-family:'Onest',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app{padding:0 16px 16px;max-width:560px}
body.focus .app{padding-bottom:110px}
.top{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.scr{position:relative;display:flex;flex-direction:column;gap:14px;padding-top:16px}
.muted{color:var(--muted)}
.pad{margin:0 2px}
.pad2{display:flex;justify-content:flex-start}
h1{font-size:26px;font-weight:800;margin:0}
h2{font-size:19px;margin:0}
h3{margin:0 0 8px}
.card{border-radius:20px;box-shadow:none;margin:0}
.btn{border-radius:14px}
.btn.sm{min-height:42px}
.btn.red{color:var(--bad);border-color:var(--line)}
/* nav */
.nav{border-top:1px solid var(--line)}
.nav-in{max-width:560px}
.nav button{gap:4px;font-size:11px;min-height:62px;color:var(--muted)}
.nav button span{font-size:11px;line-height:1.2}
.nav button.on{color:var(--pri-ink);font-weight:800}
.nav button.on::after{display:none}
.nav button.ai{color:var(--ai-ink)}
.nav button.ai.on{color:var(--ai)}
/* pills, icon buttons */
.pill2{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.iconb.dark{background:var(--ink-soft);border-color:transparent;color:var(--ink-text)}
.phead,.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead{justify-content:flex-start}
.shead h1{font-size:22px}
/* avatar */
.ava{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:999px;background:var(--pri);color:var(--pri-text);font-weight:800;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.ring{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pri)}
/* home */
.home .blob{position:absolute;right:-110px;top:-120px;width:280px;height:280px;border-radius:999px;background:var(--pri);opacity:.22;pointer-events:none}
.hhead{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--text);font:inherit;cursor:pointer;text-align:left;padding:4px 0}
.me small{display:block;font-size:13px;color:var(--muted)}
.me b{display:block;font-size:22px;line-height:1.1}
.hero{position:relative;border-radius:24px;background:var(--ink);color:var(--ink-text);padding:18px;display:flex;flex-direction:column;gap:14px}
.hero small{color:var(--ink-muted);font-size:13px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big40{font-size:40px;font-weight:800;line-height:1}
.big40 em{font-style:normal;font-size:18px;color:var(--pri)}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--ink-soft);color:#FFD23F;font-size:13px;font-weight:700;white-space:nowrap}
.setdate{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px dashed var(--ink-muted);background:transparent;color:var(--ink-text);font:inherit;font-weight:700;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-muted)}
.wd i{width:28px;height:28px;border-radius:999px;background:var(--ink-soft);box-sizing:border-box}
.wd i.on{background:var(--pri)}
.wd i.miss{background:var(--ink-soft);opacity:.55}
.wd i.today{background:transparent;border:3px solid var(--pri)}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(138,90,0,.08)}
.lhead{display:flex;align-items:center;gap:14px}
.lhead2{display:flex;justify-content:space-between;align-items:center}
.lhead2 h3{display:flex;align-items:center;gap:8px;margin:0}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.ring .rbg{fill:none;stroke:var(--soft);stroke-width:7}
.ring .rfg{fill:none;stroke:var(--pri);stroke-width:7;stroke-linecap:round}
.steps{display:flex;flex-direction:column;gap:8px}
.step2{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:15px;font-weight:600}
.step2.cur{background:var(--pri-soft);color:var(--text);font-weight:700}
.step2.done{background:var(--ok-bg);color:var(--ok)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%;border:0;border-radius:16px;background:var(--pri);color:var(--pri-text);font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--pri-shadow);text-decoration:none;position:relative}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri-shadow)}
.cta.off{opacity:.45;pointer-events:none}
.cta.sm{min-height:44px;width:auto;padding:0 18px;font-size:15px;border-radius:999px;box-shadow:none}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.tile b{font-size:18px}
.tile small{font-size:12px;color:var(--muted)}
.ti{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:12px;background:var(--pri-soft);color:var(--pri-ink);font-size:18px}
/* tabs */
.tabs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.tabs3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tabs3 button{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tabs3 button.on{background:var(--card);color:var(--text);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* path */
.tip{padding:12px 14px;border-radius:16px;background:var(--pri-soft);font-size:14px;line-height:1.45}
.pathwrap{display:flex;flex-direction:column;gap:6px}
.psec{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pban{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 16px;border-radius:16px;background:var(--ink);color:var(--ink-text)}
.pban small{display:block;font-size:12px;color:var(--ink-muted)}
.pban b{font-size:16px}
.pbr{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.stops{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px}
.stopw{display:flex;flex-direction:column;align-items:center;gap:4px}
.stopw small{font-size:12px;color:var(--muted);max-width:150px;text-align:center}
.stopw small.ail{color:var(--ai-ink);font-weight:700}
.stop{width:64px;height:64px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--soft);color:var(--muted)}
.stop.done{background:var(--ok);color:#fff}
.stop.cur{width:84px;height:84px;background:var(--pri);color:var(--pri-text);box-shadow:0 6px 0 var(--pri-shadow)}
.stop.ai.cur,.stop.ai.done{background:var(--ai);color:#fff;box-shadow:0 6px 0 #3E30A8}
.stop.ai.done{box-shadow:none}
.stop.ai.lock{background:var(--ai-bg);color:var(--ai-ink)}
.bubble{padding:5px 12px;border-radius:10px;background:var(--card);border:2px solid var(--pri);font-size:13px;font-weight:800}
.finish{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--ink);color:#FFD23F;font-weight:800}
/* lists */
.lst{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.lrow.dim{opacity:.7}
.lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lt small{color:var(--muted);font-size:13px}
.dark-cta{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px;border-radius:16px;border:0;background:var(--ink);color:var(--ink-text);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.trow{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tn{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.tn em{font-style:normal;color:var(--muted)}
.tn em.bad{color:var(--bad)}
.tb{margin-bottom:12px}
h3.sub{margin:6px 2px 0}
.bar{height:6px;background:var(--soft);margin-top:0}
/* AI */
.aichip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--ai);color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
.aibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--ai-line);background:var(--ai-bg);color:var(--ai-ink);font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.aibtns2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.aibub,.aicard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--ai-bg);border:1px solid var(--ai-line);margin-top:8px}
.aibub.sm{font-size:13px;margin:0}
.aibub .aichip,.aicard .aichip{align-self:flex-start}
.aicard p{margin:0}
.aitxt{white-space:pre-wrap;line-height:1.5}
/* chat */
.chat{min-height:calc(100vh - 110px)}
.chead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chead>div{flex:1;min-width:0;display:flex;flex-direction:column}
.chead small{color:var(--muted);font-size:12px}
.aiava{width:42px;height:42px;flex:none;border-radius:999px;background:var(--ai);color:#fff;display:flex;align-items:center;justify-content:center}
.msgs{display:flex;flex-direction:column;gap:10px;flex:1}
.bub{max-width:86%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.bub.sys{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--ink-text);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;display:flex;flex-direction:column;gap:6px;background:var(--ai-bg);border:1px solid var(--ai-line);border-bottom-left-radius:6px}
.bub.ai .aichip{align-self:flex-start}
.bub.err{align-self:flex-start;background:var(--bad-bg);color:var(--bad)}
.bub.q{align-self:stretch;max-width:none;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line)}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.qos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qo{min-height:46px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.qo.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.qo.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ai-line);background:var(--card);color:var(--ai-ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;align-self:flex-start}
.cinput{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 0;background:var(--bg)}
.cinput input{flex:1;min-height:48px;border-color:var(--ai-line)}
.sendb{width:48px;height:48px;flex:none;border-radius:14px;border:0;background:var(--ai);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sendb:disabled,.cinput input:disabled{opacity:.5}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qt{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.qt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbody{display:flex;flex-direction:column;gap:12px}
.qkind{font-size:13px;font-weight:600;color:var(--muted)}
.qtext2{font-size:21px;line-height:1.35;font-weight:700;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt2{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:17px;text-align:left;cursor:pointer}
.opt2 .bx{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:999px;border:2px solid var(--line);color:var(--pri-text)}
.opt2 .bx.sq{border-radius:7px}
.opt2 .txt{flex:1}
.opt2 .mk{display:flex}
.opt2.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt2.sel .bx{background:var(--pri);border-color:var(--pri)}
.opt2.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt2.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb2{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px}
.fb2.ok{background:var(--ok-bg);color:var(--ok)}
.fb2.bad{background:var(--bad-bg);color:var(--bad)}
.fb2.part{background:var(--pri-soft);color:var(--pri-ink)}
.fb2 .ex{color:var(--text)}
.fb2 small{color:var(--muted)}
.qfoot{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.qfoot>*{max-width:528px;margin:0 auto}
.qfoot.two{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.qfoot.two .btn{margin:0;min-height:56px}
/* result */
.resbig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.rs{font-size:56px;font-weight:800;line-height:1}
.rs span{font-size:26px;color:var(--muted)}
.rm{font-size:17px;font-weight:700}
.lost{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--pri-soft)}
.lost small{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--pri-ink)}
.lost b{font-size:19px}
.exl,.exl2{display:flex;flex-direction:column;gap:8px}
.exl div,.exl2 div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.exl{color:var(--ink-muted)}
.exl b{color:var(--ink-text)}
.exh{gap:12px}
.mg{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.mg summary{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;cursor:pointer;list-style:none;font-weight:700}
.mg summary::-webkit-details-marker{display:none}
.mg summary span:last-child{display:flex;align-items:center;gap:6px;font-weight:500}
.mg[open] summary svg{transform:rotate(180deg)}
.mg .rev{margin:0 16px 12px}
.donebox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 10px}
/* theory swipe */
.deck{position:relative;margin-top:6px;padding-bottom:12px}
.dk{position:absolute;left:12px;right:12px;top:14px;bottom:0;border-radius:24px;background:var(--soft)}
.dk.d1{left:6px;right:6px;top:7px;bottom:6px;background:var(--pri-soft);border:1px solid var(--line)}
.swcard{position:relative;min-height:360px;display:flex;flex-direction:column;gap:12px;padding:22px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px rgba(138,90,0,.12);touch-action:pan-y;transition:transform .15s ease,border-color .15s;user-select:none}
.swcard.gy{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.swcard.gn{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.swcard h2{font-size:24px}
.swcard .tbody{margin:0;line-height:1.55}
.swhint{margin:auto 0 0;font-size:12px;color:var(--muted);text-align:center}
.swbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:sticky;bottom:12px}
.sw{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:16px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.sw.no{border:2px solid var(--bad);background:var(--card);color:var(--bad)}
.sw.yes{border:0;background:var(--ok);color:#fff}
/* plan */
.cal{display:flex;flex-direction:column;gap:8px}
.calh,.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.calh span{font-size:11px;font-weight:700;color:var(--muted)}
.cd2{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.cd2.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cd2.miss{background:var(--soft);border-color:var(--soft);color:var(--muted)}
.cd2.today{background:var(--pri);border-color:var(--pri);color:var(--pri-text);box-shadow:0 0 0 2px var(--text)}
.cd2.exam{background:var(--ink);color:#FFD23F;border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-on{background:var(--ok)} .lg-miss{background:var(--soft)} .lg-today{background:var(--pri)}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk i{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none}
.chk.ok{color:var(--ok)}
.chk.ok span{text-decoration:line-through;opacity:.8}
/* profile */
.prof .pband{position:absolute;left:-16px;right:-16px;top:0;height:170px;background:var(--pri);opacity:.55;border-radius:0 0 40px 40px}
.phead2{position:relative}
.pme{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pava{position:relative}
.pava .ava{box-shadow:0 0 0 5px var(--bg)}
.camb{position:absolute;right:0;bottom:2px;width:44px;height:44px;border-radius:999px;background:var(--ink);color:var(--ink-text);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg);cursor:pointer}
.pname{font-size:24px}
.pbtns{display:flex;gap:10px;align-items:center}
.pbtns .btn{margin:0;width:auto;padding:0 16px}
.pbtns label.cta{cursor:pointer}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.stats3 b{font-size:20px}
.stats3 b.fl{color:var(--fire)}
.stats3 small{font-size:12px;color:var(--muted)}
.sets{padding:4px 16px}
.setr{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid var(--soft)}
.setr:last-child{border-bottom:0}
.setr select{width:auto;min-height:42px}
.aiset h3{display:flex;align-items:center;gap:8px}
.mapc .kzmap{width:100%;height:auto;display:block;margin:6px 0}
.kzmap .mr{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round}
.kzmap .mc{fill:var(--card);stroke:var(--line);stroke-width:3}
.kzmap .mc.go{fill:var(--pri);stroke:var(--card)}
.kzmap .mc.ok{fill:var(--ok);stroke:var(--card)}
.kzmap .ml{font-size:10px;fill:var(--muted);text-anchor:middle}
.kzmap .ml.b{font-weight:800;fill:var(--text);font-size:11px}
.kzmap .mst{fill:var(--ink)}
.kzmap .mstt{fill:#FFD23F;font-size:18px;text-anchor:middle}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:90vw;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--ink-text);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.center{text-align:center}
.hard{border-bottom:1px solid var(--line)}
@media (max-width:360px){.tiles3{grid-template-columns:1fr 1fr}.big40{font-size:34px}}

.aibtn.wide{width:100%;margin-top:12px}
.aibtn:disabled{opacity:.5}
.achhero{gap:10px}
.achbar{height:10px;border-radius:99px;background:var(--ink-soft);overflow:hidden}
.achbar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.achl2{display:flex;flex-direction:column;gap:10px}
.ach{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);opacity:.6}
.ach.on{opacity:1;border-color:var(--pri);background:var(--pri-soft)}
.achi{width:52px;height:52px;flex:none;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:28px}
.ach:not(.on) .achi{filter:grayscale(1)}
.acht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acht small{color:var(--muted)}
.achok{width:28px;height:28px;border-radius:99px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.achl{color:var(--muted);flex:none}

.authlogo{display:block;margin:0 auto;border-radius:26px;filter:drop-shadow(0 10px 18px rgba(138,90,0,.3))}
.instc{display:flex;gap:14px;align-items:flex-start}
.instc>img{border-radius:14px;flex:none}
.instc>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  </style>
</head>

  { id: "numsys-001", topic: "numsys", level: 1, type: "single", q: "Convert the binary number 1011 to decimal.", options: ["9", "10", "11", "13"], answer: [2], explain: "1·8 + 0·4 + 1·2 + 1·1 = 11." },
  { id: "numsys-002", topic: "numsys", level: 1, type: "single", q: "Convert decimal 25 to binary.", options: ["10101", "11001", "11011", "10011"], answer: [1], explain: "25 = 16 + 8 + 1 = 11001₂." },
  { id: "numsys-003", topic: "numsys", level: 2, type: "single", q: "Convert the hexadecimal number 1F to decimal.", options: ["15", "16", "31", "32"], answer: [2], explain: "1·16 + 15 = 31." },
  { id: "numsys-004", topic: "numsys", level: 2, type: "single", q: "What is 101₂ + 11₂ in binary?", options: ["1000", "1010", "111", "1100"], answer: [0], explain: "5 + 3 = 8, and 8 = 1000₂." },
  { id: "numsys-005", topic: "numsys", level: 2, type: "single", q: "Convert the octal number 17 to decimal.", options: ["7", "15", "17", "23"], answer: [1], explain: "1·8 + 7 = 15." },
  { id: "numsys-006", topic: "numsys", level: 2, type: "multi", q: "Which notations equal decimal 10?", options: ["1010 (binary)", "12 (octal)", "A (hexadecimal)", "11 (binary)"], answer: [0, 1, 2], explain: "1010₂ = 10; 12₈ = 8 + 2 = 10; A₁₆ = 10; but 11₂ = 3." },
  { id: "numsys-007", topic: "numsys", level: 2, type: "single", q: "Convert decimal 100 to binary.", options: ["1100100", "1100110", "1010100", "1100010"], answer: [0], explain: "100 = 64 + 32 + 4 = 1100100₂." },
  { id: "numsys-008", topic: "numsys", level: 2, type: "single", q: "Convert the hexadecimal number A5 to decimal.", options: ["155", "165", "175", "185"], answer: [1], explain: "A = 10, so 10·16 + 5 = 165." },

  { id: "logic-001", topic: "logic", level: 1, type: "single", q: "When is A ∧ B (AND) true?", options: ["A=1, B=0", "A=0, B=1", "A=1, B=1", "A=0, B=0"], answer: [2], explain: "A conjunction is true only when both values are true." },
  { id: "logic-002", topic: "logic", level: 1, type: "single", q: "Which expression is always true?", options: ["A ∧ ¬A", "A ∨ ¬A", "¬A ∧ ¬A", "A ⊕ A"], answer: [1], explain: "A ∨ ¬A is the law of excluded middle, always 1." },
  { id: "logic-003", topic: "logic", level: 2, type: "single", q: "By De Morgan's law, what is ¬(A ∧ B) equal to?", options: ["¬A ∧ ¬B", "¬A ∨ ¬B", "A ∨ B", "A ∧ ¬B"], answer: [1], explain: "¬(A ∧ B) = ¬A ∨ ¬B." },
  { id: "logic-004", topic: "logic", level: 2, type: "single", q: "When is the implication A → B false?", options: ["A=0, B=1", "A=1, B=0", "A=1, B=1", "A=0, B=0"], answer: [1], explain: "An implication is false only when it goes from true to false." },
  { id: "logic-005", topic: "logic", level: 1, type: "single", q: "How many rows does the truth table of an expression with three variables have?", options: ["3", "6", "8", "9"], answer: [2], explain: "2^3 = 8 rows." },
  { id: "logic-006", topic: "logic", level: 2, type: "multi", q: "Which logical operations are commutative (the operands can be swapped)?", options: ["Conjunction (∧)", "Disjunction (∨)", "Implication (→)", "XOR, addition modulo 2 (⊕)"], answer: [0, 1, 3], explain: "A → B and B → A are not equal; for the others, swapping the operands does not change the result." },
  { id: "logic-007", topic: "logic", level: 2, type: "single", q: "What is the expression ¬(A ∨ B) equal to?", options: ["¬A ∨ ¬B", "¬A ∧ ¬B", "A ∧ B", "A ∨ ¬B"], answer: [1], explain: "De Morgan's law: ¬(A ∨ B) = ¬A ∧ ¬B." },
  { id: "logic-008", topic: "logic", level: 1, type: "single", q: "If A = 1 and B = 1, what is A ⊕ B (XOR, addition modulo 2)?", options: ["0", "1", "2", "undefined"], answer: [0], explain: "⊕ gives 1 only when the values differ. Here they are the same, so the result is 0." },

  { id: "algo-001", topic: "algo", level: 1, type: "single", q: "Which of the following is NOT a property of an algorithm?", options: ["Discreteness", "Definiteness", "Effectiveness", "Ambiguity"], answer: [3], explain: "An algorithm must be precise; ambiguity is not allowed." },
  { id: "algo-002", topic: "algo", level: 1, type: "single", q: "Which shape marks a condition (decision) block in a flowchart?", options: ["Rectangle", "Diamond", "Oval", "Parallelogram"], answer: [1], explain: "Condition — diamond, action — rectangle, start/end — oval, input/output — parallelogram." },
  { id: "algo-003", topic: "algo", level: 2, type: "single", q: "Let s = 0. As i goes from 1 to 4, each step runs s = s + i. What is s at the end?", options: ["4", "6", "10", "24"], answer: [2], explain: "1 + 2 + 3 + 4 = 10." },
  { id: "algo-004", topic: "algo", level: 2, type: "single", q: "x = 5. If x > 3 then x = x · 2, otherwise x = x − 1. What is x at the end?", options: ["4", "5", "10", "15"], answer: [2], explain: "5 > 3 holds, so x = 5 · 2 = 10." },
  { id: "algo-005", topic: "algo", level: 1, type: "single", q: "Which is NOT a basic algorithm structure?", options: ["Sequence (sequential execution)", "Branching", "Loop (repetition)", "Encryption"], answer: [3], explain: "The basic structures are sequence, branching and loop." },
  { id: "algo-006", topic: "algo", level: 1, type: "multi", q: "What ways of writing an algorithm exist?", options: ["Verbal description", "Flowchart", "Program code", "Decorating with pictures"], answer: [0, 1, 2], explain: "An algorithm is written verbally, as a flowchart, or in a programming language." },
  { id: "algo-007", topic: "algo", level: 2, type: "single", q: "x = 3. Repeat while x < 10: x = x + 4. What is x when the loop ends?", options: ["7", "10", "11", "15"], answer: [2], explain: "3 → 7 → 11. The condition 11 < 10 fails, so the loop stops." },
  { id: "algo-008", topic: "algo", level: 2, type: "single", q: "p = 1. As i goes from 1 to 5, p = p · i is executed. What is p at the end?", options: ["15", "24", "120", "720"], answer: [2], explain: "1·2·3·4·5 = 120 (5 factorial)." },

  { id: "prog-001", topic: "prog", level: 1, type: "single", q: "Python: what does print(2 + 3 * 2) output?", options: ["10", "8", "12", "7"], answer: [1], explain: "Multiplication first: 3 · 2 = 6, then 2 + 6 = 8." },
  { id: "prog-002", topic: "prog", level: 1, type: "single", q: "Python: what does print(7 // 2) output?", options: ["3.5", "3", "4", "2"], answer: [1], explain: "// is floor division: 7 // 2 = 3." },
  { id: "prog-003", topic: "prog", level: 1, type: "single", q: "Python: what does print(7 % 3) output?", options: ["1", "2", "0", "3"], answer: [0], explain: "% is the remainder: 7 = 3·2 + 1." },
  { id: "prog-004", topic: "prog", level: 1, type: "single", q: "Python: what is len(\"ArUBT\")?", options: ["4", "5", "6", "3"], answer: [1], explain: "The string has 5 characters: A, r, U, B, T." },
  { id: "prog-005", topic: "prog", level: 2, type: "single", q: "Python: how many times does the loop for i in range(1, 5): ... run?", options: ["3", "4", "5", "6"], answer: [1], explain: "range(1, 5) yields 1, 2, 3, 4. The upper bound is excluded." },
  { id: "prog-006", topic: "prog", level: 1, type: "multi", q: "Which of these are data types in Python?", options: ["int", "str", "float", "while"], answer: [0, 1, 2], explain: "while is a loop statement, not a type." },
  { id: "prog-007", topic: "prog", level: 1, type: "single", q: "Python: what does print(\"ab\" * 3) output?", options: ["ab3", "ababab", "aaabbb", "ab ab ab"], answer: [1], explain: "Multiplying a string by a number repeats it that many times." },
  { id: "prog-008", topic: "prog", level: 2, type: "single", q: "Python: a = [1, 2, 3]; what does print(a[-1]) output?", options: ["1", "2", "3", "raises an error"], answer: [2], explain: "A negative index counts from the end of the list: a[-1] is the last element." },

  { id: "sheets-001", topic: "sheets", level: 1, type: "single", q: "Which is an absolute reference?", options: ["A1", "$A$1", "A1:B2", "=A1"], answer: [1], explain: "The $ sign fixes the column and row; it does not change when copied." },
  { id: "sheets-002", topic: "sheets", level: 1, type: "single", q: "If A1 = 1, A2 = 2, A3 = 3, what does =SUM(A1:A3) return?", options: ["3", "5", "6", "123"], answer: [2], explain: "1 + 2 + 3 = 6." },
  { id: "sheets-003", topic: "sheets", level: 1, type: "single", q: "If A1 = 2, A2 = 4, A3 = 6, what does =AVERAGE(A1:A3) return?", options: ["4", "6", "12", "3"], answer: [0], explain: "(2 + 4 + 6) / 3 = 4." },
  { id: "sheets-004", topic: "sheets", level: 1, type: "single", q: "Which character does a spreadsheet formula start with?", options: ["=", "#", "@", "!"], answer: [0], explain: "A formula always starts with the = sign." },
  { id: "sheets-005", topic: "sheets", level: 2, type: "single", q: "The formula =A1*2 in cell B1 is copied to B2. What does it become?", options: ["=A1*2", "=A2*2", "=B2*2", "=A1*3"], answer: [1], explain: "A relative reference shifts by row when copied: A1 → A2." },
  { id: "sheets-006", topic: "sheets", level: 1, type: "multi", q: "Which of these are spreadsheet functions?", options: ["SUM", "AVERAGE", "MAX", "PRINT"], answer: [0, 1, 2], explain: "PRINT is not a standard spreadsheet function." },
  { id: "sheets-007", topic: "sheets", level: 1, type: "single", q: "If A1 = 5, A2 = 9, A3 = 2, what does =MAX(A1:A3) return?", options: ["2", "5", "9", "16"], answer: [2], explain: "MAX returns the largest value: 9." },
  { id: "sheets-008", topic: "sheets", level: 2, type: "single", q: "If A1 = 7, what does =IF(A1>5; \"Yes\"; \"No\") return?", options: ["Yes", "No", "7", "5"], answer: [0], explain: "7 > 5 is true, so the first value, \"Yes\", is returned." },

  { id: "db-001", topic: "db", level: 1, type: "single", q: "What is the field that uniquely identifies each record in a table called?", options: ["Primary key", "Field name", "Filter", "Report"], answer: [0], explain: "A primary key value is never repeated in the table." },
  { id: "db-002", topic: "db", level: 1, type: "single", q: "Which SQL command is used to retrieve data from a database?", options: ["INSERT", "SELECT", "DELETE", "UPDATE"], answer: [1], explain: "SELECT — retrieve, INSERT — add, DELETE — remove, UPDATE — modify." },
  { id: "db-003", topic: "db", level: 1, type: "single", q: "What is one row of a relational table called?", options: ["Field", "Record", "Key", "Column"], answer: [1], explain: "A row is a record, a column is a field." },
  { id: "db-004", topic: "db", level: 2, type: "single", q: "What does the query SELECT * FROM students WHERE age > 17 select?", options: ["All data of students older than 17", "Students who are exactly 17", "All students", "Only the age column"], answer: [0], explain: "* means all fields; WHERE age > 17 keeps only records with age above 17." },
  { id: "db-005", topic: "db", level: 1, type: "single", q: "What is a table column called?", options: ["Record", "Field", "Key", "Form"], answer: [1], explain: "A column is a field; it stores data of one type." },
  { id: "db-006", topic: "db", level: 1, type: "multi", q: "Which of these are SQL commands?", options: ["SELECT", "INSERT", "DELETE", "PRINT"], answer: [0, 1, 2], explain: "PRINT is not a core SQL command." },
  { id: "db-007", topic: "db", level: 2, type: "single", q: "What is the field in one table that refers to the key of another table, linking the two tables, called?", options: ["Foreign key", "Filter", "Form", "Macro"], answer: [0], explain: "A foreign key refers to the primary key of another table and links the tables." },
  { id: "db-008", topic: "db", level: 1, type: "single", q: "Which SQL command changes the values of an existing record?", options: ["SELECT", "INSERT", "UPDATE", "CREATE"], answer: [2], explain: "UPDATE ... SET ... modifies existing records." },

  { id: "net-001", topic: "net", level: 1, type: "single", q: "How many bytes does an IPv4 address consist of?", options: ["2", "4", "6", "8"], answer: [1], explain: "IPv4 is 32 bits, i.e. 4 bytes (for example, 192.168.0.1)." },
  { id: "net-002", topic: "net", level: 1, type: "single", q: "What does the letter S in HTTPS stand for?", options: ["Server", "Secure", "Speed", "Simple"], answer: [1], explain: "HTTPS is HTTP Secure; the data is sent encrypted." },
  { id: "net-003", topic: "net", level: 1, type: "single", q: "Which service converts a domain name into an IP address?", options: ["DHCP", "DNS", "FTP", "SMTP"], answer: [1], explain: "DNS translates a domain name into an IP address." },
  { id: "net-004", topic: "net", level: 1, type: "single", q: "Which protocol is used to send email?", options: ["HTTP", "SMTP", "FTP", "DNS"], answer: [1], explain: "SMTP is the protocol for sending mail." },
  { id: "net-005", topic: "net", level: 1, type: "single", q: "What is phishing?", options: ["A way to speed up a computer", "Tricking people into giving up secret data through a fake site or email", "Archiving a file", "Measuring network speed"], answer: [1], explain: "Phishing tricks a user into revealing a login, password or card details." },
  { id: "net-006", topic: "net", level: 1, type: "multi", q: "What are the features of a strong password?", options: ["Long enough", "A mix of letters, digits and symbols", "Made of a birthday", "Different on every site"], answer: [0, 1, 3], explain: "Personal data such as a birthday is easy to guess." },
  { id: "net-007", topic: "net", level: 1, type: "single", q: "What is the network topology called in which all devices connect to one central node (switch)?", options: ["Bus", "Star", "Ring", "Tree"], answer: [1], explain: "In a star topology all devices connect to a central node." },
  { id: "net-008", topic: "net", level: 1, type: "single", q: "What is the network that connects computers in one building or room called?", options: ["LAN", "WAN", "MAN", "Global network"], answer: [0], explain: "LAN is a local area network." },

  { id: "hw-001", topic: "hw", level: 1, type: "single", q: "Which is the main device that performs calculations in a computer?", options: ["Main memory", "Processor", "Hard disk", "Monitor"], answer: [1], explain: "The processor (CPU) executes instructions." },
  { id: "hw-002", topic: "hw", level: 1, type: "single", q: "Which memory loses its data when the computer is turned off?", options: ["Hard disk (HDD)", "Main memory (RAM)", "SSD", "Flash memory"], answer: [1], explain: "RAM is volatile memory; data is lost when the power goes off." },
  { id: "hw-003", topic: "hw", level: 1, type: "single", q: "Which of the following is an operating system?", options: ["Word", "Windows", "Chrome", "Excel"], answer: [1], explain: "Windows is an operating system; the others are application programs." },
  { id: "hw-004", topic: "hw", level: 1, type: "single", q: "Which is an input device?", options: ["Monitor", "Printer", "Keyboard", "Speaker"], answer: [2], explain: "A keyboard enters information into the computer." },
  { id: "hw-005", topic: "hw", level: 1, type: "multi", q: "Which are output devices?", options: ["Monitor", "Printer", "Mouse", "Keyboard"], answer: [0, 1], explain: "A monitor and a printer output information; a mouse and a keyboard input it." },
  { id: "hw-006", topic: "hw", level: 1, type: "single", q: "Which program creates a file with the .docx extension?", options: ["Excel", "Word", "PowerPoint", "Paint"], answer: [1], explain: ".docx is a Microsoft Word document." },
  { id: "hw-007", topic: "hw", level: 1, type: "single", q: "How many GB are in 1 TB?", options: ["100", "1000", "1024", "2048"], answer: [2], explain: "1 TB = 1024 GB." },
  { id: "hw-008", topic: "hw", level: 1, type: "single", q: "Which of these is system software?", options: ["Device driver", "Photoshop", "Excel", "Paint"], answer: [0], explain: "A driver is system software that lets the operating system work with a device." }
];

/* ============ Theory lessons (English source) ============ */
const THEORY = [
  { id: "info-t1", topic: "info", title: "Types and Properties of Information",
    body: "Information is knowledge about the surrounding world, events and phenomena.\nTypes: text, numeric, graphic, sound, video.\nProperties: complete, accurate, up to date, understandable, useful.",
    box: "A computer stores any information as 0s and 1s (binary code)." },
  { id: "info-t2", topic: "info", title: "Units of Measurement",
    body: "The smallest unit is the bit (0 or 1). Larger units grow by a factor of 1024.",

  { id: "info-t3", topic: "info", title: "Alphabet Power and Symbol Weight",
    body: "The number of symbols in an alphabet is its power (N). If one symbol carries i bits, N and i are related by this formula.",
    box: "N = 2^i\nExample: if N = 64, then 64 = 2^6, so i = 6 bits." },
  { id: "info-t4", topic: "info", title: "Calculating Information Size",
    body: "Text: size = number of characters × weight of one character.\nImage: size = width × height × color depth per pixel.\nSound: size = frequency × depth × time × number of channels.\nExample: 10 characters, 8 bits each. 10 · 8 = 80 bits = 10 bytes.",
    box: "Always check the unit at the end: bits or bytes?" },

  { id: "numsys-t1", topic: "numsys", title: "Positional and Non-positional Systems",
    body: "In a positional system the value of a digit depends on its place (position): decimal, binary, octal, hexadecimal.\nIn a non-positional system a digit's value does not depend on its place: Roman numerals (I, V, X, L, C).\nThe base of a system is the number of digits it uses." },
  { id: "numsys-t2", topic: "numsys", title: "Converting from Decimal to Another System",
    body: "Divide the number by the base with a remainder. Read the remainders from last to first.\nExample: 13 → binary. 13:2=6 (remainder 1), 6:2=3 (0), 3:2=1 (1), 1:2=0 (1).",
    box: "13₁₀ = 1101₂" },
  { id: "numsys-t3", topic: "numsys", title: "Converting from Another System to Decimal",
    body: "Multiply each digit by its place's power and add up.\nExample: 1011₂ = 1·2³ + 0·2² + 1·2¹ + 1·2⁰ = 8 + 0 + 2 + 1 = 11.\nRemember the powers of 2: 1, 2, 4, 8, 16, 32, 64, 128, 256.",
    box: "Hexadecimal digits: A=10, B=11, C=12, D=13, E=14, F=15" },
  { id: "numsys-t4", topic: "numsys", title: "Quick Conversion Between 2, 8 and 16",

  { id: "numsys-t5", topic: "numsys", title: "Binary Arithmetic",
    body: "The addition rules are short. When a place exceeds 1, a 1 carries to the next place.",

  { id: "logic-t1", topic: "logic", title: "Basic Logical Operations",
    body: "Negation ¬A: inverts the value.\nConjunction A ∧ B ('and'): 1 only when both are 1.\nDisjunction A ∨ B ('or'): 1 if at least one is 1.\nImplication A → B: 0 only when A=1 and B=0.\nXOR (addition modulo 2) A ⊕ B: 1 when the values differ.\nEquivalence A ≡ B: 1 when the values are the same." },
  { id: "logic-t2", topic: "logic", title: "Laws of Logic",
    body: "De Morgan's laws are the main tool for simplifying expressions.",
    box: "¬(A ∧ B) = ¬A ∨ ¬B\n¬(A ∨ B) = ¬A ∧ ¬B\n¬¬A = A\nA ∨ ¬A = 1\nA ∧ ¬A = 0\nA ∨ (A ∧ B) = A" },
  { id: "logic-t3", topic: "logic", title: "Building a Truth Table",
    body: "With n variables the table has 2ⁿ rows. Order of operations: parentheses, ¬, ∧, ∨, →.\nBuild the table column by column: inner expressions first, the full expression last." },
  { id: "logic-t4", topic: "logic", title: "Simplification Example",
    body: "Example: (A ∧ B) ∨ (A ∧ ¬B).\nFactor A out of the parentheses: A ∧ (B ∨ ¬B).\nB ∨ ¬B = 1, so the result is A ∧ 1 = A." },

  { id: "algo-t1", topic: "algo", title: "Algorithm and Its Properties",

  { id: "algo-t2", topic: "algo", title: "Flowchart Elements",

  { id: "algo-t3", topic: "algo", title: "Basic Structures",

  { id: "algo-t4", topic: "algo", title: "Tracing an Algorithm by Hand",

  { id: "prog-t1", topic: "prog", title: "Data Types and Input",

  { id: "prog-t2", topic: "prog", title: "Arithmetic Operations",

  { id: "sheets-t1", topic: "sheets", title: "Cell References",

  "logic-t4": { t: "Пример упрощения", b: "Пример: (A ∧ B) ∨ (A ∧ ¬B).\nВыносим A за скобки: A ∧ (B ∨ ¬B).\nB ∨ ¬B = 1, поэтому результат A ∧ 1 = A." },
  "algo-t1": { t: "Алгоритм и его свойства", b: "Алгоритм — точная последовательность действий для решения задачи.\nСвойства: дискретность (делится на шаги), определённость (однозначность), результативность (завершается за конечное число шагов), массовость (подходит для задач одного типа)." },
  "algo-t2": { t: "Элементы блок-схемы", b: "Овал — начало и конец.\nПрямоугольник — вычисление или действие.\nРомб — проверка условия (да / нет).\nПараллелограмм — ввод и вывод.\nСтрелки показывают порядок выполнения." },
  "algo-t3": { t: "Базовые структуры", b: "Следование: команды выполняются в порядке записи.\nВетвление: путь выбирается в зависимости от условия (if / else).\nЦикл: действие повторяется. Цикл со счётчиком (for) — когда число повторений известно, цикл с условием (while) — когда зависит от условия." },
  "algo-t4": { t: "Ручная трассировка алгоритма", b: "Выполняйте алгоритм по таблице: столбец на каждую переменную, строка на каждый шаг.\nВ цикле проверяйте условие перед каждым повторением. Цикл останавливается, когда условие ложно.", x: "Если записывать значения переменных в таблицу, а не держать в голове, ошибок меньше." },
  "prog-t1": { t: "Типы данных и ввод", b: "int — целое, float — дробное, str — строка, bool — True/False, list — список.\ninput() всегда возвращает строку, поэтому при необходимости преобразуйте её в число." },
  "prog-t2": { t: "Арифметические операции", b: "+ сложение, − вычитание, * умножение, / деление (результат всегда float), // целая часть, % остаток, ** степень.\nПорядок как в математике: скобки, **, * / // %, + −." },
  "prog-t3": { t: "Условный оператор", b: "Ветвление записывается через if, elif, else. Блок выделяется отступом.\nСравнение: ==, !=, <, >, <=, >=. Логические операторы: and, or, not.", x: "if x > 0:\n    print(\"положительное\")\nelif x == 0:\n    print(\"ноль\")\nelse:\n    print(\"отрицательное\")" },
  "prog-t4": { t: "Циклы", b: "for i in range(a, b) — i пробегает от a до b-1 (b не входит). range(5) — 0, 1, 2, 3, 4.\nwhile условие: — повторяет, пока условие истинно. Если условие не меняется, цикл бесконечный." },
  "prog-t5": { t: "Списки и строки", b: "Индексация начинается с 0. Отрицательный индекс считается с конца: a[-1] — последний элемент.\nlen(a) — длина, a.append(x) — добавить в конец, a[1:3] — элементы с индексами 1 и 2 (3 не входит).\nСтроки можно соединять через + и повторять через *." },
  "sheets-t1": { t: "Ссылки на ячейки", b: "Относительная ссылка (A1): при копировании меняется по положению.\nАбсолютная ($A$1): при копировании не меняется.\nСмешанная ($A1 или A$1): фиксируется только часть.\nКлавиша F4 переключает тип ссылки." },
  "sheets-t2": { t: "Основные функции", b: "SUM — сумма, AVERAGE — среднее, MIN/MAX — наименьшее/наибольшее, COUNT — число числовых ячеек, IF — значение по условию.\nДиапазон A1:A10 — все эти ячейки.", x: "=SUM(A1:A3)\n=AVERAGE(B1:B5)\n=IF(A1>5; \"Да\"; \"Нет\")" },
  "sheets-t3": { t: "Диаграммы", b: "Столбчатая (гистограмма): сравнение значений.\nКруговая: части целого (доля, процент).\nЛинейная: изменение во времени.\nПри изменении данных диаграмма обновляется автоматически." },
  "sheets-t4": { t: "Сортировка и фильтрация", b: "Сортировка упорядочивает данные по возрастанию или убыванию.\nФильтр показывает строки, удовлетворяющие условию, а остальные временно скрывает (не удаляет).\nУсловное форматирование автоматически меняет цвет ячейки по её значению." },
  "db-t1": { t: "Основные понятия", b: "База данных — упорядоченная совокупность данных. СУБД — программа для управления ею.\nТаблица состоит из строк (записей) и столбцов (полей).\nПервичный ключ — поле, однозначно определяющее каждую запись; его значение никогда не повторяется." },
  "db-t2": { t: "Связи между таблицами", b: "Таблицы связываются внешним ключом: поле одной таблицы ссылается на первичный ключ другой.\nВиды связей: один к одному, один ко многим, многие ко многим.\nПример: таблицы «Класс» и «Ученик»: в одном классе много учеников." },
  "db-t3": { t: "Команды SQL", b: "SELECT — выборка, INSERT — добавление, UPDATE — изменение, DELETE — удаление.\nWHERE — условие, ORDER BY — сортировка, LIKE — поиск по шаблону." },
  "db-t4": { t: "Как составить запрос", b: "1) Из какой таблицы брать данные (FROM).\n2) Какие поля нужны (SELECT).\n3) Какое условие (WHERE).\n4) Если важен порядок, добавьте ORDER BY.\nВ условии текст пишут в кавычках, числа — без кавычек." },
  "net-t1": { t: "Виды сетей и топологии", b: "LAN — локальная сеть (одно здание), MAN — городская, WAN — региональная/глобальная. Интернет — всемирная сеть.\nТопологии: шина, звезда, кольцо, дерево. В современных офисных и домашних сетях чаще всего используется звезда." },
  "net-t2": { t: "Адреса и протоколы", b: "Адрес IPv4 — 4 байта, разделённые точками (192.168.0.1). Каждый байт в диапазоне 0–255.\nDNS переводит доменное имя (например, example.kz) в IP.\nПротоколы: HTTP/HTTPS — веб-страницы, FTP — передача файлов, SMTP — отправка почты, POP3/IMAP — получение почты, TCP/IP — основной сетевой протокол." },
  "net-t3": { t: "Информационная безопасность", b: "Вирус — вредоносная программа, которая копирует себя. Фишинг — обман с целью получить секретные данные через поддельный сайт или письмо.\nЗащита: антивирус, брандмауэр, обновления системы, надёжный и разный пароль для каждого сайта, двухфакторная аутентификация.", x: "Не переходите по подозрительным ссылкам и никому не сообщайте пароль." },
  "net-t4": { t: "Сервисы интернета", b: "WWW — система веб-страниц, электронная почта, поисковые системы, облачное хранилище (данные хранятся на сервере и доступны с любого устройства), видеоконференции." },
  "hw-t1": { t: "Основные части компьютера", b: "Процессор выполняет команды. RAM хранит данные, используемые прямо сейчас, и очищается при отключении питания. Постоянная память (жёсткий диск HDD, SSD, флеш) хранит данные долго.\nМатеринская плата соединяет все части." },
  "hw-t2": { t: "Устройства ввода и вывода", b: "Ввод: клавиатура, мышь, сканер, микрофон, веб-камера.\nВывод: монитор, принтер, колонки, проектор.\nНекоторые устройства выполняют обе функции (сенсорный экран)." },
  "hw-t3": { t: "Программное обеспечение", b: "Системное: операционная система (Windows, Linux, macOS, Android), драйверы.\nПрикладное: Word, Excel, браузер, игры.\nСистемы программирования: языки и среды программирования (Python, редакторы)." },
  "hw-t4": { t: "Файлы и расширения", b: "Имя файла состоит из названия и расширения. Расширение показывает тип файла.\n.txt — текст, .docx — Word, .xlsx — Excel, .pptx — презентация, .jpg/.png — изображение, .mp3 — звук, .mp4 — видео, .exe — исполняемая программа.\nАрхивация уменьшает размер файла (.zip, .rar)." }
};

/* ============ Question generators ============
   A generated question id is "gen:<kind>:<seed>" (or "gen:<kind>:<seed>:<k>" for context tasks),
   so the same question can be rebuilt later from its id (mistake notebook, spaced repetition). */
function rngOf(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const shufR = (r, a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const kOf = v => Array.isArray(v) ? v.join('|') : String(v);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const frac = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n).replace('-', '−') : (n < 0 ? '−' : '') + Math.abs(n) + '/' + d; };
const neg = n => String(n).replace('-', '−');
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const SUB = { 2: '₂', 8: '₈', 10: '₁₀', 16: '₁₆' };
const inB = (v, b) => v.toString(b).toUpperCase() + SUB[b];

/* single choice: correct value + candidate wrong values -> 4 shuffled options */
function mc(r, correct, cands) {
  const ck = kOf(correct), seen = new Set([ck]), wr = [];
  for (const x of cands) {
    const k = kOf(x);
    if (x === undefined || x === null || k === 'NaN' || k === '' || k === 'Infinity' || seen.has(k)) continue;
    seen.add(k); wr.push(x); if (wr.length === 3) break;
  }
  let d = 1;
  while (wr.length < 3 && typeof correct === 'number') {
    for (const x of [correct + d, correct - d]) { const k = String(x); if (wr.length < 3 && !seen.has(k)) { seen.add(k); wr.push(x); } }
    d++;
  }
  const opts = shufR(r, [correct, ...wr]).map(x => typeof x === 'number' ? neg(x) : x);
  return { options: opts, answer: [opts.findIndex(x => kOf(x) === kOf(typeof correct === 'number' ? neg(correct) : correct))] };
}
/* multiple answer: arrays of right and wrong options -> 6 shuffled options */
function ma(r, right, wrong) {
  const all = shufR(r, right.map(x => [x, 1]).concat(wrong.map(x => [x, 0])));
  return { type: 'multi', options: all.map(x => x[0]), answer: all.map((x, i) => x[1] ? i : -1).filter(i => i >= 0) };
}

  { id: "m-206", topic: "m_seq", level: 2, type: "match", q: ["Match the formula with its meaning.", "Формуланы мағынасымен сәйкестендіріңіз.", "Сопоставьте формулу с её смыслом."], left: ["aₙ = a₁ + (n − 1)d", "bₙ = b₁·qⁿ⁻¹", "Sₙ = (a₁ + aₙ)·n/2", "S = b₁/(1 − q)"], options: [["n-th term of an arithmetic progression", "Арифметикалық прогрессияның n-мүшесі", "n-й член арифметической прогрессии"], ["n-th term of a geometric progression", "Геометриялық прогрессияның n-мүшесі", "n-й член геометрической прогрессии"], ["Sum of an arithmetic progression", "Арифметикалық прогрессия қосындысы", "Сумма арифметической прогрессии"], ["Sum of an infinite decreasing geometric progression", "Шексіз кемімелі геометриялық прогрессия қосындысы", "Сумма бесконечно убывающей геометрической прогрессии"], ["Area of a circle", "Дөңгелек ауданы", "Площадь круга"], ["Discriminant", "Дискриминант", "Дискриминант"]], answer: [0, 1, 2, 3], explain: ["d — common difference, q — common ratio (|q| < 1 for the infinite sum).", "d — айырым, q — еселік (шексіз қосынды үшін |q| < 1).", "d — разность, q — знаменатель (для бесконечной суммы |q| < 1)."] },
  { id: "m-207", topic: "m_arith", level: 1, type: "multi", q: ["Which numbers are divisible by 9?", "Қай сандар 9-ға бөлінеді?", "Какие числа делятся на 9?"], options: ["108", "243", "5013", "106", "1234", "1000"], answer: [0, 1, 2], explain: ["Digit sum divisible by 9: 1+0+8 = 9, 2+4+3 = 9, 5+0+1+3 = 9.", "Цифрлар қосындысы 9-ға бөлінеді: 1+0+8 = 9, 2+4+3 = 9, 5+0+1+3 = 9.", "Сумма цифр делится на 9: 1+0+8 = 9, 2+4+3 = 9, 5+0+1+3 = 9."] }
